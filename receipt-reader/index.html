<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レシート読み取り</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<style>
  :root{--g:#2e7d32;--bd:#d0d7d0;--bg:#f6f8f6}
  body{font-family:system-ui,"Hiragino Sans","Meiryo",sans-serif;margin:0;background:var(--bg);color:#222}
  header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;margin:0}
  main{padding:16px;max-width:1100px;margin:auto}
  .card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
  button,select{font-size:16px;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:#fff}
  button.main{background:var(--g);color:#fff;border-color:var(--g)}
  button:disabled{opacity:.5}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
  th,td{border:1px solid var(--bd);padding:4px 6px;white-space:nowrap}
  td input{font-size:14px;width:100%;box-sizing:border-box;border:0;padding:4px}
  tr.off{opacity:.45}
  tr.err td{background:#fff3e0}
  #msg{color:#555;font-size:14px}
</style>
</head>
<body>
<header><h1>レシート読み取り</h1><button id="cfg">設定</button></header>
<main>
  <div class="card">
    <div class="row">
      <label>拠点
        <select id="home">
          <option>西九条ホーム</option><option>九条ホーム</option><option>酉島ホーム</option>
          <option>新郡山ホーム</option><option>春日出ホーム</option><option>出来島ホーム</option><option>本社</option>
        </select>
      </label>
      <input id="file" type="file" accept="image/*" multiple capture="environment" hidden>
      <button class="main" id="pick">撮影・写真を選ぶ</button>
      <span id="msg">写真は何枚でもまとめて選べます。</span>
    </div>
  </div>
  <div class="card scroll">
    <table id="tbl">
      <thead><tr>
        <th>対象</th><th>拠点</th><th>日付</th><th>店名</th><th>税込合計</th><th>8%対象</th><th>10%対象</th>
        <th>T番号</th><th>勘定科目</th><th>理由</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="row">
    <button class="main" id="csv" disabled>対象だけCSVにする</button>
    <button id="clear">一覧を消す</button>
  </div>
  <p id="note" style="font-size:13px;color:#666">
    読み取り結果は必ず目で確認してから使ってください。TKC取込用の形式は、見本を受け取ってから対応します。
  </p>
</main>
<script>
"use strict";
var KEY = "receipt-reader-cfg";
var rows = [];
var $ = function (id) { return document.getElementById(id); };

function cfg() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function askCfg() {
  var c = cfg();
  var url = prompt("GASのウェブアプリURL", c.url || ""); if (url === null) return;
  var token = prompt("合言葉（APP_TOKEN）", c.token || ""); if (token === null) return;
  try { localStorage.setItem(KEY, JSON.stringify({ url: url.trim(), token: token.trim() })); } catch (e) {}
}
$("cfg").onclick = askCfg;
$("pick").onclick = function () { $("file").click(); };
$("clear").onclick = function () { if (confirm("一覧を消しますか")) { rows = []; render(); } };

// 写真を縮小してJPEGにする（通信量と読み取り費用を抑える）
function shrink(file) {
  return new Promise(function (ok, ng) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, 1600 / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      ok(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    img.onerror = function () { ng(new Error("画像を開けません")); };
    img.src = u;
  });
}

$("file").onchange = async function (e) {
  var c = cfg();
  if (!c.url || !c.token) { askCfg(); c = cfg(); if (!c.url) return; }
  var files = Array.from(e.target.files); e.target.value = "";
  for (var i = 0; i < files.length; i++) {
    $("msg").textContent = "読み取り中 " + (i + 1) + " / " + files.length;
    var row = { on: false, home: $("home").value, error: "" };
    try {
      var b64 = await shrink(files[i]);
      var res = await fetch(c.url, {
        method: "POST", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ token: c.token, image: b64, mediaType: "image/jpeg" })
      });
      var j = await res.json();
      if (!j.ok) throw new Error(j.error);
      var d = j.data;
      row = Object.assign(row, {
        on: d.is_business === true && d.readable !== false,
        date: d.date, store: d.store, total: d.total, tax8: d.tax8, tax10: d.tax10,
        invoice_no: d.invoice_no, account: d.account, reason: d.reason
      });
    } catch (err) { row.error = String(err.message || err); row.reason = "要確認: " + row.error; }
    rows.push(row); render();
  }
  $("msg").textContent = "読み取り完了。内容を確認してください。";
};

var FIELDS = ["date", "store", "total", "tax8", "tax10", "invoice_no", "account", "reason"];
function render() {
  var tb = $("tbl").tBodies[0]; tb.innerHTML = "";
  rows.forEach(function (r, i) {
    var tr = document.createElement("tr");
    if (!r.on) tr.className = r.error ? "err" : "off";
    var td = document.createElement("td"), cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = r.on;
    cb.onchange = function () { r.on = cb.checked; render(); };
    td.appendChild(cb); tr.appendChild(td);
    var th = document.createElement("td"); th.textContent = r.home; tr.appendChild(th);
    FIELDS.forEach(function (f) {
      var t = document.createElement("td"), inp = document.createElement("input");
      inp.value = r[f] == null ? "" : r[f];
      inp.onchange = function () { r[f] = inp.value; };
      t.appendChild(inp); tr.appendChild(t);
    });
    tb.appendChild(tr);
  });
  $("csv").disabled = !rows.some(function (r) { return r.on; });
}

function q(v) { v = v == null ? "" : String(v); return '"' + v.replace(/"/g, '""') + '"'; }
$("csv").onclick = function () {
  var head = ["拠点", "日付", "店名", "税込合計", "8%対象", "10%対象", "T番号", "勘定科目", "理由"];
  var lines = [head.map(q).join(",")];
  rows.filter(function (r) { return r.on; }).forEach(function (r) {
    lines.push([r.home, r.date, r.store, r.total, r.tax8, r.tax10, r.invoice_no, r.account, r.reason].map(q).join(","));
  });
  var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "receipts-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
};
render();
</script>
</body>
</html>
