<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<title>利用者月間生活カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 配置: 上に操作帯。中央に、現行のExcel様式と同じ形の月間表
   (赤い注意帯 / 日付ごとの朝食・夕食 / 緑の帰宅帯・桃色の実家泊帯 / 黄色の連絡帯)。
   同じ内容を「縦(一覧)」でも表示・印刷できる。色は意味を持つものだけに使う。 */
:root {
  --bg: #eef1ec;
  --surface: #ffffff;
  --surface-2: #f5f7f3;
  --fg: #1f2a22;
  --muted: #56655b;
  --line: #d3dbd0;
  --line-strong: #8f9e90;
  --accent: #2f6b3b;
  --accent-fg: #ffffff;
  --accent-soft: #e0eddc;
  --focus: #1b5fb0;
  --sun: #c0392b;
  --sat: #2a5fa8;
  --sun-tint: #fdf1ef;
  --sat-tint: #eff4fb;
  --out-bg: #f0f2ee;
  --warn-bg: #fff2d1;
  --warn-fg: #6b4300;
  --warn-line: #e3b95a;
  --danger: #b3261e;
  --top-bg: #ff3b30;   --top-fg: #1a0000;
  --foot-bg: #ffe600;  --foot-fg: #1f1b00;
  --band-back-bg: #7be08a; --band-back-fg: #0b2d10;
  --band-stay-bg: #ff9b9b; --band-stay-fg: #4a0b0b;
  --k-day-bg: #e2eedf;   --k-day-fg: #1c4726;   --k-day-bar: #2f6b3b;
  --k-hosp-bg: #fbe3ec;  --k-hosp-fg: #7a1d3f;  --k-hosp-bar: #b0306a;
  --k-out-bg: #dceaf8;   --k-out-fg: #17406e;   --k-out-bar: #2a6fb5;
  --k-visit-bg: #fff0cf; --k-visit-fg: #6b4300; --k-visit-bar: #c27d00;
  --k-other-bg: #ebe5f5; --k-other-fg: #43306a; --k-other-bar: #6d4fa3;
  --legal-fg: #4a4f57;   --legal-line: #7b828c;
  --font: "BIZ UDPGothic", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a15; --surface: #1c251f; --surface-2: #222d25; --fg: #e6ece7; --muted: #a2b1a6;
    --line: #33423a; --line-strong: #6b7f70; --accent: #7fc48c; --accent-fg: #0f1f13; --accent-soft: #263b2b;
    --focus: #7db4f2; --sun: #ff8a7d; --sat: #8db8f0; --sun-tint: #2a1f1f; --sat-tint: #1c2634; --out-bg: #171f19;
    --warn-bg: #3a2f12; --warn-fg: #f3d58f; --warn-line: #7a6325; --danger: #ff8a80;
    --top-bg: #8f1d18; --top-fg: #ffeceb; --foot-bg: #5f5200; --foot-fg: #fff6bf;
    --band-back-bg: #1f6b2c; --band-back-fg: #dff7e3; --band-stay-bg: #8a3a3a; --band-stay-fg: #ffe4e4;
    --k-day-bg: #25402b;   --k-day-fg: #bfe5c6;   --k-day-bar: #7fc48c;
    --k-hosp-bg: #4a2433;  --k-hosp-fg: #f6c4d6;  --k-hosp-bar: #e57ba5;
    --k-out-bg: #1f3650;   --k-out-fg: #bcd9f6;   --k-out-bar: #7db4f2;
    --k-visit-bg: #46371a; --k-visit-fg: #f6dba2; --k-visit-bar: #e0a73a;
    --k-other-bg: #36294f; --k-other-fg: #d9cdf2; --k-other-bar: #a98be0;
    --legal-fg: #b7bec8;   --legal-line: #7f8895;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a15; --surface: #1c251f; --surface-2: #222d25; --fg: #e6ece7; --muted: #a2b1a6;
  --line: #33423a; --line-strong: #6b7f70; --accent: #7fc48c; --accent-fg: #0f1f13; --accent-soft: #263b2b;
  --focus: #7db4f2; --sun: #ff8a7d; --sat: #8db8f0; --sun-tint: #2a1f1f; --sat-tint: #1c2634; --out-bg: #171f19;
  --warn-bg: #3a2f12; --warn-fg: #f3d58f; --warn-line: #7a6325; --danger: #ff8a80;
  --top-bg: #8f1d18; --top-fg: #ffeceb; --foot-bg: #5f5200; --foot-fg: #fff6bf;
  --band-back-bg: #1f6b2c; --band-back-fg: #dff7e3; --band-stay-bg: #8a3a3a; --band-stay-fg: #ffe4e4;
  --k-day-bg: #25402b;   --k-day-fg: #bfe5c6;   --k-day-bar: #7fc48c;
  --k-hosp-bg: #4a2433;  --k-hosp-fg: #f6c4d6;  --k-hosp-bar: #e57ba5;
  --k-out-bg: #1f3650;   --k-out-fg: #bcd9f6;   --k-out-bar: #7db4f2;
  --k-visit-bg: #46371a; --k-visit-fg: #f6dba2; --k-visit-bar: #e0a73a;
  --k-other-bg: #36294f; --k-other-fg: #d9cdf2; --k-other-bar: #a98be0;
  --legal-fg: #b7bec8;   --legal-line: #7f8895;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 15px; line-height: 1.55;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px; padding-top: 14px; }

/* 上部バー */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.top h1 { font-size: 20px; margin: 0; line-height: 1.3; text-wrap: balance; }
.badge-proto { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.top .spacer { flex: 1; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 2px solid var(--line); }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* 共通部品 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card h2 { font-size: 16px; margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.row > * { min-width: 0; }
.grow { flex: 1 1 180px; }
label.f { display: grid; gap: 3px; font-size: 13px; color: var(--muted); font-weight: 700; }
select, input[type="text"], input[type="date"], input[type="time"], textarea {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; padding: 8px 10px; min-height: 42px; width: 100%; color: var(--fg);
}
textarea { resize: vertical; line-height: 1.5; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 14px; min-height: 42px; font-weight: 700; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.icon { padding: 8px 12px; }
.btn[disabled] { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; min-height: 42px; font-weight: 700; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.chk { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-size: 14px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.note { padding: 9px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); font-size: 14px; }
.note.info { background: var(--accent-soft); color: var(--fg); border-color: var(--line-strong); }
.month-nav { display: flex; align-items: center; gap: 6px; }
.month-nav .ym { font-size: 20px; font-weight: 700; min-width: 7.5em; text-align: center; font-variant-numeric: tabular-nums; }

/* 凡例 */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; border-left: 5px solid; display: inline-block; }
.sw.k-day { background: var(--k-day-bg); border-color: var(--k-day-bar); }
.sw.k-hosp { background: var(--k-hosp-bg); border-color: var(--k-hosp-bar); }
.sw.k-out { background: var(--k-out-bg); border-color: var(--k-out-bar); }
.sw.k-visit { background: var(--k-visit-bg); border-color: var(--k-visit-bar); }
.sw.k-other { background: var(--k-other-bg); border-color: var(--k-other-bar); }
.sw.k-back { background: var(--band-back-bg); border-color: var(--band-back-bg); }
.sw.k-stay { background: var(--band-stay-bg); border-color: var(--band-stay-bg); }
.sw.legal { background: transparent; border: 1.5px dashed var(--legal-line); width: 16px; }

/* ===== 月間表(Excel様式) ===== */
.sheet { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; display: flex; flex-direction: column; min-width: 0; color: var(--fg); }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 6px 12px; padding: 10px 12px 6px; }
.sheet-head .ttl { font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.sheet-head .nm { font-size: 26px; font-weight: 700; line-height: 1.2; text-align: center; }
.sheet-head .en { text-align: right; font-size: 13px; line-height: 1.35; }
.banner { text-align: center; font-weight: 700; font-size: 20px; line-height: 1.35; padding: 5px 12px; margin: 0 12px; overflow-wrap: anywhere; white-space: pre-line; }
.banner.top { background: var(--top-bg); color: var(--top-fg); }
.banner.foot { background: var(--foot-bg); color: var(--foot-fg); margin: 10px 12px 12px; padding: 10px 12px; font-size: 20px; }
.banner:empty { display: none; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 6px 12px 0; border-top: 1px solid var(--fg); border-left: 1px solid var(--fg); }
.wd { text-align: center; font-weight: 400; padding: 2px 0; font-size: 13px; border-right: 1px solid var(--fg); border-bottom: 1px solid var(--fg); background: var(--surface-2); }
.wd.sun { color: var(--sun); } .wd.sat { color: var(--sat); }
.cell { position: relative; min-height: 118px; padding: 3px 4px 3px; border-right: 1px solid var(--fg); border-bottom: 1px solid var(--fg); display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; cursor: pointer; background: var(--surface); }
.cell:hover { background: var(--surface-2); }
.cell.out { background: var(--out-bg); cursor: default; }
.cell.out:hover { background: var(--out-bg); }
.dn { display: flex; align-items: baseline; gap: 5px; line-height: 1.1; min-height: 18px; }
.dn .num { font-size: 17px; font-variant-numeric: tabular-nums; padding-left: 2px; }
.dn .hn { font-size: 10.5px; color: var(--sun); line-height: 1.2; }
.cell.sun .num, .cell.hol .num { color: var(--sun); } .cell.sat .num { color: var(--sat); }
.cell .bot { margin-top: auto; display: grid; gap: 1px; min-width: 0; }
.meals { display: grid; gap: 0; font-size: 12px; font-weight: 700; line-height: 1.3; }
.meal { display: flex; gap: .8em; }
.meal .mv.no { font-weight: 400; color: var(--muted); }
.meal .mv.yes { text-decoration: underline; text-underline-offset: 2px; }
.chip { border-left: 4px solid; border-radius: 3px; padding: 1px 4px 2px; font-size: 12px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.chip .t { font-weight: 700; display: block; }
.chip .tm { font-size: 11px; font-variant-numeric: tabular-nums; }
.chip .sb { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 0 4px; border-radius: 3px; background: var(--fg); color: var(--surface); margin-left: 3px; vertical-align: 1px; }
.chip .sn { display: block; font-size: 11px; }
.chip .lk { font-size: 10.5px; font-weight: 700; margin-left: 3px; }
.chip.stale, .band.stale, .ic.stale { outline: 2px dashed var(--danger); outline-offset: -2px; }
.band { border-radius: 2px; padding: 0 4px; font-size: 12px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.band .lk { font-size: 10.5px; margin-left: 3px; }
.band.k-back { background: var(--band-back-bg); color: var(--band-back-fg); }
.band.k-stay { background: var(--band-stay-bg); color: var(--band-stay-fg); }
.k-day { background: var(--k-day-bg); color: var(--k-day-fg); border-color: var(--k-day-bar); }
.k-hosp { background: var(--k-hosp-bg); color: var(--k-hosp-fg); border-color: var(--k-hosp-bar); }
.k-out { background: var(--k-out-bg); color: var(--k-out-fg); border-color: var(--k-out-bar); }
.k-visit { background: var(--k-visit-bg); color: var(--k-visit-fg); border-color: var(--k-visit-bar); }
.k-other { background: var(--k-other-bg); color: var(--k-other-fg); border-color: var(--k-other-bar); }
.chip.legal, .ic.legal { background: transparent; color: var(--legal-fg); border: 1.5px dashed var(--legal-line); }
.chip.legal .t::before, .ic.legal b::before { content: "法定 "; font-weight: 700; font-size: 10.5px; }
.counter { font-size: 12px; color: var(--muted); text-align: right; }

/* ===== 縦(一覧)表 ===== */
.vhead, .vr { display: grid; grid-template-columns: 8.2em 3.8em 3.8em minmax(0, 1fr); }
.vwrap { margin: 6px 12px 0; border-top: 1px solid var(--fg); border-left: 1px solid var(--fg); }
.vhead > div { text-align: center; font-size: 13px; padding: 3px 4px; background: var(--surface-2); border-right: 1px solid var(--fg); border-bottom: 1px solid var(--fg); }
.vr { cursor: pointer; background: var(--surface); }
.vr:hover { background: var(--surface-2); }
.vr > div { border-right: 1px solid var(--fg); border-bottom: 1px solid var(--fg); padding: 4px 8px; display: flex; align-items: center; min-width: 0; }
.vr.sun { background: var(--sun-tint); } .vr.sat { background: var(--sat-tint); }
.vr .vd { gap: 6px; flex-wrap: nowrap; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 15px; }
.vr .vd b { font-weight: 700; }
.vr .vd.sun, .vr .vd.hol { color: var(--sun); } .vr .vd.sat { color: var(--sat); }
.vr .vd small { font-size: 10.5px; color: var(--sun); line-height: 1.2; white-space: normal; }
.vr .vm { justify-content: center; font-size: 14px; font-weight: 700; }
.vr .vm.no { font-weight: 400; color: var(--muted); }
.vr .vm.yes { text-decoration: underline; text-underline-offset: 3px; }
.vr .vev { flex-wrap: wrap; gap: 3px 8px; }
.ic { display: inline-flex; align-items: baseline; gap: 6px; padding: 1px 7px; border-left: 4px solid; border-radius: 3px; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.ic b { font-weight: 700; }
.ic .tm { font-variant-numeric: tabular-nums; font-size: 13px; }
.ic.band { border-left: 0; padding: 1px 8px; }
.ic.band.k-back { background: var(--band-back-bg); color: var(--band-back-fg); }
.ic.band.k-stay { background: var(--band-stay-bg); color: var(--band-stay-fg); }
.ic .sb { font-size: 11px; font-weight: 700; padding: 0 4px; border-radius: 3px; background: var(--fg); color: var(--surface); }
.ic .lk { font-size: 11px; font-weight: 700; }
.none { color: var(--muted); font-size: 13px; }

/* 表(結果・名簿) */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-size: 13px; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 700; border-top: 2px solid var(--line-strong); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface-2); white-space: nowrap; }
.pill.ok { background: var(--accent-soft); }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }

/* 固定予定カード */
.rules { display: grid; gap: 10px; }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: start; border: 1px solid var(--line); border-left-width: 6px; border-radius: 8px; padding: 10px 12px; background: var(--surface); color: var(--fg); }
.rule.k-day { border-left-color: var(--k-day-bar); } .rule.k-hosp { border-left-color: var(--k-hosp-bar); }
.rule.k-out { border-left-color: var(--k-out-bar); } .rule.k-visit { border-left-color: var(--k-visit-bar); } .rule.k-other { border-left-color: var(--k-other-bar); }
.rule.k-back { border-left-color: var(--band-back-bg); } .rule.k-stay { border-left-color: var(--band-stay-bg); }
.rule .rt { font-weight: 700; }
.rule .rd { font-size: 14px; color: var(--muted); }
.rule .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .rule { grid-template-columns: 1fr; } .rule .acts { justify-content: flex-start; } }

/* 通所先・名簿 */
.fac { display: grid; gap: 10px; }
.closed-list { display: grid; gap: 6px; }
.closed-item { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 10px; background: var(--surface-2); border-radius: 7px; }
.add-closed { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: end; }
.wdchecks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.names { display: flex; flex-wrap: wrap; gap: 6px; }
.nm-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border: 1px solid var(--line-strong); border-radius: 99px; background: var(--surface-2); font-size: 14px; }
.nm-chip button { border: 0; background: none; color: var(--danger); font-weight: 700; min-height: 30px; padding: 0 8px; }
.pick { display: flex; flex-wrap: wrap; gap: 4px 14px; }

/* ダイアログ */
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 12, .55); display: grid; place-items: center; z-index: 50; padding: 12px; overflow-y: auto; }
.dlg { background: var(--surface); color: var(--fg); border-radius: 12px; border: 1px solid var(--line-strong); width: min(640px, 100%); max-height: calc(100% - 8px); overflow-y: auto; padding: 16px; display: grid; gap: 12px; }
.dlg h2 { margin: 0; font-size: 18px; }
.dlg-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 12px; }
.span-all { grid-column: 1 / -1; }
.err { color: var(--danger); font-weight: 700; font-size: 14px; }
.ev-row { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
.ev-row .chip { font-size: 14px; }
.ev-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.skip-list { margin: 4px 0 0; padding-left: 1.2em; font-size: 14px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 99px; font-weight: 700; z-index: 80; max-width: calc(100% - 32px); }
.sheets { display: grid; gap: 18px; }

@media (max-width: 700px) {
  .sheet-head { grid-template-columns: 1fr auto; }
  .sheet-head .nm { grid-column: 1 / -1; grid-row: 1; text-align: left; font-size: 22px; }
  .sheet-head .ttl { font-size: 20px; }
  .banner, .banner.foot { font-size: 15px; }
  .cell { min-height: 78px; padding: 2px; }
  .dn .num { font-size: 14px; }

  tab: 'cal',
  homeId: 'h1',
  residentId: null,
  y: bm0.y, m: bm0.m,
  view: isNarrow ? 'list' : 'grid',
  showLegal: true,
  modal: null,
  bulk: null, bulkY: shiftMonth(bm0.y, bm0.m, 1).y, bulkM: shiftMonth(bm0.y, bm0.m, 1).m, bulkHomes: null, bulkDry: false,
  pLayout: 'grid', pSel: null,
  roster: null, rosterText: '', rosterReplace: true, confirmDelRes: null,
  confirmReset: false, confirmDel: null,
  toast: ''
};
var IS_TOP = (function () { try { return window.top === window.self; } catch (e) { return false; } })();

function residentsOf(homeId) { return st.residents.filter(function (r) { return r.homeId === homeId; }); }
function homeOf(id) { return st.homes.filter(function (h) { return h.id === id; })[0]; }
function resOf(id) { return st.residents.filter(function (r) { return r.id === id; })[0]; }
function facOf(id) { return st.facilities.filter(function (f) { return f.id === id; })[0]; }
function curRes() {
  var r = resOf(ui.residentId);
  if (!r || r.homeId !== ui.homeId) { r = residentsOf(ui.homeId)[0]; ui.residentId = r ? r.id : null; }
  return r;
}
function bandOrder(e) { return KINDS[e.kind] && KINDS[e.kind].band ? 1 : 0; }
function eventsOn(resId, date) {
  return st.events.filter(function (e) { return e.residentId === resId && e.date === date; })
    .sort(function (a, b) {
      return (bandOrder(a) - bandOrder(b)) || (a.start || '00:00').localeCompare(b.start || '00:00');
    });
}
function legalOn(res, date) {
  return ui.showLegal ? res.legal.filter(function (l) { return l.date === date; }) : [];
}
function monthEvents(resId, y, m) {
  var prefix = y + '-' + pad(m) + '-';
  return st.events.filter(function (e) { return e.residentId === resId && e.date.indexOf(prefix) === 0; });
}
function ruleSummary(r) {
  var days = r.weekdays.slice().sort(function (a, b) { return a - b; }).map(function (d) { return WD[d]; }).join('・');
  var every = r.weekdays.length === 7;
  var when = r.nth.length
    ? r.nth.slice().sort(function (a, b) { return (a === -1 ? 9 : a) - (b === -1 ? 9 : b); }).map(function (n) { return n === -1 ? '最終' : '第' + n; }).join('・') + ' ' + (every ? '毎日' : days + '曜日')
    : (every ? '毎日' : '毎週 ' + days + '曜日');
  return when + (r.start ? '　' + fmtTime(r.start, r.end) : '');
}

/* ---- 食事(あり/なし) ----
   利用者ごとの設定(毎日なし / 通所のある日だけあり / 毎日あり)から自動で決める。
   日ごとの手直し(mealOv)があればそれを優先する。 */
function mealsOf(res, date, evs) {
  var ov = st.mealOv[res.id + '|' + date] || {};
  var hasDay = evs.some(function (e) { return e.kind === 'day'; });
  var hasStay = evs.some(function (e) { return e.kind === 'stay'; });
  var auto = function (mode, isDinner) {
    if (mode === 'all') return true;
    if (mode === 'attend') return hasDay && !(isDinner && hasStay);
    return false;
  };
  var meals = res.meals || { b: 'none', d: 'attend' };
  return {
    b: ov.b === 'yes' ? true : ov.b === 'no' ? false : auto(meals.b, false),
    d: ov.d === 'yes' ? true : ov.d === 'no' ? false : auto(meals.d, true),
    auto: { b: auto(meals.b, false), d: auto(meals.d, true) }
  };
}

/* ---- 注意帯(赤)・連絡帯(黄): 前月の文面を引き継ぐ(Excelの前月コピーと同じ) ---- */
function getNote(res, field, y, m) {
  var cy = y, cm = m;
  for (var i = 0; i < 24; i++) {
    var n = st.notes[res.id + '|' + cy + '-' + pad(cm)];
    if (n && n[field] !== undefined) return { v: n[field], inherited: i > 0 };
    var s = shiftMonth(cy, cm, -1); cy = s.y; cm = s.m;
  }
  return { v: '', inherited: true };
}
function setNote(res, field, y, m, value) {
  var key = res.id + '|' + y + '-' + pad(m);
  if (!st.notes[key]) st.notes[key] = {};
  st.notes[key][field] = value;
  save();
}

/* ============================================================
   描画: 月間表
   ============================================================ */
function chipHtml(e) {
  var stale = e.stale ? ' stale' : '';
  var lk = e.locked ? '<span class="lk" title="確定済み">[確定]</span>' : '';
  if (KINDS[e.kind].band) return '<div class="band k-' + e.kind + stale + '">' + esc(e.title) + lk + '</div>';
  var sb = e.staff ? '<span class="sb">職員</span>' : '';
  var tm = fmtTime(e.start, e.end);
  var place = e.place ? '<span class="sn">' + esc(e.place) + '</span>' : '';
  var sn = e.staff && e.staffNote ? '<span class="sn">' + esc(e.staffNote) + '</span>' : '';
  return '<div class="chip k-' + e.kind + stale + '"><span class="t">' + esc(e.title) + sb + lk + '</span>' + (tm ? '<span class="tm">' + esc(tm) + '</span>' : '') + place + sn + '</div>';
}
function inlineChipHtml(e) {
  var stale = e.stale ? ' stale' : '';
  var lk = e.locked ? '<span class="lk">[確定]</span>' : '';
  if (KINDS[e.kind].band) return '<span class="ic band k-' + e.kind + stale + '"><b>' + esc(e.title) + '</b>' + lk + '</span>';
  var tm = fmtTime(e.start, e.end);
  return '<span class="ic k-' + e.kind + stale + '"><b>' + esc(e.title) + '</b>' + (tm ? '<span class="tm">' + esc(tm) + '</span>' : '')
    + (e.place ? '<span>' + esc(e.place) + '</span>' : '')
    + (e.staff ? '<span class="sb">職員</span>' + (e.staffNote ? '<span>' + esc(e.staffNote) + '</span>' : '') : '') + lk + '</span>';
}
function legalChipHtml(l) { return '<div class="chip legal"><span class="t">' + esc(l.label) + '</span></div>'; }
function legalInlineHtml(l) { return '<span class="ic legal"><b>' + esc(l.label) + '</b></span>'; }
function mealHtml(mm) {
  var v = function (on) { return '<span class="mv ' + (on ? 'yes' : 'no') + '">' + (on ? 'あり' : 'なし') + '</span>'; };
  return '<div class="meals"><div class="meal"><span>朝食</span>' + v(mm.b) + '</div><div class="meal"><span>夕食</span>' + v(mm.d) + '</div></div>';
}

function sheetHtml(res, y, m, layout, opts) {
  opts = opts || {};
  var home = homeOf(res.homeId), days = dim(y, m), first = wdOf(y, m, 1);
  var rows = Math.ceil((first + days) / 7);
  var hol = holidays(y);
  var top = getNote(res, 'top', y, m).v, foot = getNote(res, 'foot', y, m).v;
  var act = function (date) { return opts.stat ? '' : ' role="button" tabindex="0" data-action="day" data-date="' + date + '"'; };
  var h = '<section class="sheet l-' + layout + '" style="--rows:' + rows + ';--days:' + days + '" aria-label="' + esc(ymLabel(y, m) + ' ' + res.name + 'さんの月間予定') + '">';
  h += '<div class="sheet-head"><div class="ttl">' + y + '年' + m + '月</div><div class="nm">' + esc(res.name) + '</div>'
    + '<div class="en">' + EN_MONTH[m - 1] + '<br>' + reiwa(y) + '<br><span class="muted">' + esc(home.name) + '</span></div></div>';
  h += '<div class="banner top" data-role="note-top">' + esc(top) + '</div>';
  if (layout === 'list') {
    h += '<div class="vwrap"><div class="vhead"><div>日付</div><div>朝食</div><div>夕食</div><div>予定・行き先</div></div><div class="vbody">';
    for (var d = 1; d <= days; d++) {
      var date = ymd(y, m, d), wd = wdOf(y, m, d);
      var evs = eventsOn(res.id, date), lg = legalOn(res, date), mm = mealsOf(res, date, evs);
      var items = evs.map(inlineChipHtml).concat(lg.map(legalInlineHtml));
      h += '<div class="vr ' + (wd === 0 ? 'sun' : wd === 6 ? 'sat' : '') + (items.length >= 4 ? ' dense' : '') + '"' + act(date) + '>'
        + '<div class="vd ' + (hol[date] ? 'hol' : wd === 0 ? 'sun' : wd === 6 ? 'sat' : '') + '"><b>' + m + '/' + d + '</b>(' + WD[wd] + ')' + (hol[date] ? '<small>' + esc(hol[date]) + '</small>' : '') + '</div>'
        + '<div class="vm ' + (mm.b ? 'yes' : 'no') + '">' + (mm.b ? 'あり' : 'なし') + '</div>'
        + '<div class="vm ' + (mm.d ? 'yes' : 'no') + '">' + (mm.d ? 'あり' : 'なし') + '</div>'
        + '<div class="vev">' + (items.length ? items.join('') : '<span class="none">予定なし</span>') + '</div></div>';
    }
    h += '</div></div>';
  } else {
    h += '<div class="grid">';
    WD.forEach(function (w, i) { h += '<div class="wd ' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</div>'; });
    for (var c = 0; c < rows * 7; c++) {
      var dd = c - first + 1;
      if (dd < 1 || dd > days) { h += '<div class="cell out" aria-hidden="true"></div>'; continue; }
      var dt = ymd(y, m, dd), w2 = c % 7;
      var ev2 = eventsOn(res.id, dt), lg2 = legalOn(res, dt), m2 = mealsOf(res, dt, ev2);
      var n = ev2.length + lg2.length;
      var cc = 'cell' + (w2 === 0 ? ' sun' : w2 === 6 ? ' sat' : '') + (hol[dt] ? ' hol' : '')
        + (n >= 4 || (rows === 6 && n >= 3) ? ' dense' : '') + (n >= 5 || (rows === 6 && n >= 4) ? ' denser' : '');
      h += '<div class="' + cc + '"' + act(dt) + ' aria-label="' + esc(jpDate(dt) + (hol[dt] ? ' ' + hol[dt] : '') + ' 予定' + n + '件') + '">'
        + '<div class="dn"><span class="num">' + dd + '</span>' + (hol[dt] ? '<span class="hn">' + esc(hol[dt]) + '</span>' : '') + '</div>'
        + '<div class="bot">' + ev2.filter(function (e) { return !KINDS[e.kind].band; }).map(chipHtml).join('') + lg2.map(legalChipHtml).join('')
        + mealHtml(m2) + ev2.filter(function (e) { return KINDS[e.kind].band; }).map(chipHtml).join('') + '</div></div>';
    }
    h += '</div>';
  }
  h += '<div class="banner foot" data-role="note-foot">' + esc(foot) + '</div>';
  h += '</section>';
  return h;
}

function pickerHtml(res) {
  var homeRes = residentsOf(ui.homeId);
  return '<label class="f grow"><span>ホーム</span><select id="sel-home" data-bind="home">'
    + st.homes.map(function (x) { return '<option value="' + x.id + '"' + (x.id === ui.homeId ? ' selected' : '') + '>' + esc(x.name) + '(' + residentsOf(x.id).length + '名)</option>'; }).join('')
    + '</select></label>'
    + '<label class="f grow"><span>利用者</span><select id="sel-res" data-bind="res">'
    + homeRes.map(function (x) { return '<option value="' + x.id + '"' + (res && x.id === res.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('')
    + '</select></label>';
}
function legendHtml() {
  return '<div class="legend noprint">'
    + Object.keys(KINDS).map(function (k) { return '<span><i class="sw k-' + k + '"></i>' + KINDS[k].label + '</span>'; }).join('')
    + '<span><b style="background:var(--fg);color:var(--surface);font-size:11px;padding:0 4px;border-radius:3px">職員</b>職員の対応が必要</span>'
    + '<span><i class="sw legal"></i>法定記録(モニタリング等)</span></div>';
}

function calendarTab() {
  var res = curRes();
  var h = '<div class="card noprint"><div class="row">' + pickerHtml(res)
    + '<div class="row" style="align-self:end"><button class="btn icon" data-action="res-prev" aria-label="前の利用者">◀</button><button class="btn icon" data-action="res-next" aria-label="次の利用者">▶</button></div>'
    + '</div>'
    + '<div class="row" style="margin-top:10px">'
    + '<div class="month-nav"><button class="btn icon" data-action="m-prev" aria-label="前の月">◀</button><div class="ym">' + ymLabel(ui.y, ui.m) + '</div><button class="btn icon" data-action="m-next" aria-label="次の月">▶</button></div>'
    + '<button class="btn small" data-action="m-next-real">翌月へ</button>'
    + '<span style="flex:1"></span>'
    + '<div class="seg" role="group" aria-label="表示の切り替え"><button data-action="view-grid" aria-pressed="' + (ui.view === 'grid') + '">カレンダー</button><button data-action="view-list" aria-pressed="' + (ui.view === 'list') + '">縦(一覧)</button></div>'
    + '</div>'
    + '<div class="row" style="margin-top:8px">'
    + '<label class="chk"><input type="checkbox" data-bind="legal"' + (ui.showLegal ? ' checked' : '') + '>モニタリング・計画更新期限も表示(法定記録。生活予定とは別管理)</label>'
    + '<span style="flex:1"></span>'
    + '<button class="btn primary" data-action="gen-one">この月を自動配置</button>'
    + (IS_TOP ? '<button class="btn" data-action="print">この1枚を印刷</button>' : '<button class="btn" data-action="tab" data-tab="print">印刷へ</button>')
    + '</div></div>';
  if (!res) return h + '<div class="card">このホームには利用者がいません。「名簿」で追加してください。</div>';

  var evs = monthEvents(res.id, ui.y, ui.m);
  var stale = evs.filter(function (e) { return e.stale; }).length;
  var lockedN = evs.filter(function (e) { return e.locked; }).length;
  if (!holidayOk(ui.y)) h += '<div class="note noprint">祝日の自動計算は' + HOL_MIN + '〜' + HOL_MAX + '年に対応しています。この年は祝日を反映できません。</div>';
  if (!evs.length) h += '<div class="note info noprint">' + ymLabel(ui.y, ui.m) + 'の予定はまだありません。「この月を自動配置」を押すと、固定予定から予定を並べます。</div>';
  else h += '<div class="small muted noprint">' + ymLabel(ui.y, ui.m) + 'の予定 ' + evs.length + '件(確定済み ' + lockedN + '件)。日付を押すと詳細と食事の手直しができます。</div>';
  if (stale) h += '<div class="note noprint">固定予定や休業日の変更で、今の規則に合わなくなった予定が ' + stale + '件あります(赤い点線の枠)。自動では消していません。日付を開いて確認してください。</div>';

  var tn = getNote(res, 'top', ui.y, ui.m), fn = getNote(res, 'foot', ui.y, ui.m);
  h += '<div class="card noprint"><h2>印刷される文面</h2><div class="form-grid">'
    + '<label class="f span-all"><span>赤い注意帯(上)' + (tn.inherited && tn.v ? ' ※前月の文面を引き継いでいます' : '') + '</span><input type="text" id="note-top" maxlength="60" value="' + esc(tn.v) + '" placeholder="例: 外出するさいは、必ず世話人に行き先を伝えてください"></label>'
    + '<label class="f span-all"><span>黄色の連絡帯(下)' + (fn.inherited && fn.v ? ' ※前月の文面を引き継いでいます' : '') + '</span><textarea id="note-foot" maxlength="200" rows="3" placeholder="例: 朝の出発時間 8:00　夜の帰宅時間 18:00　時間を守ってください!">' + esc(fn.v) + '</textarea></label>'
    + '</div><div class="counter" id="note-count">連絡帯 ' + fn.v.length + ' / 200文字(印刷で切れない長さにしています)</div></div>';
  h += legendHtml();
  h += '<div class="sheets">' + sheetHtml(res, ui.y, ui.m, ui.view) + '</div>';
  return h;
}

function printTab() {
  var homeRes = residentsOf(ui.homeId);
  var sel = ui.pSel === null ? homeRes.map(function (r) { return r.id; }) : ui.pSel.filter(function (id) { return homeRes.some(function (r) { return r.id === id; }); });
  var h = '<div class="card noprint"><h2>ホームに置く月間表を印刷する</h2><div class="row">'
    + '<label class="f grow"><span>ホーム</span><select data-bind="home">'
    + st.homes.map(function (x) { return '<option value="' + x.id + '"' + (x.id === ui.homeId ? ' selected' : '') + '>' + esc(x.name) + '(' + residentsOf(x.id).length + '名)</option>'; }).join('')
    + '</select></label>'
    + '<div class="month-nav"><button class="btn icon" data-action="m-prev" aria-label="前の月">◀</button><div class="ym">' + ymLabel(ui.y, ui.m) + '</div><button class="btn icon" data-action="m-next" aria-label="次の月">▶</button></div>'
    + '<div class="seg" role="group" aria-label="用紙の形"><button data-action="p-grid" aria-pressed="' + (ui.pLayout === 'grid') + '">カレンダー(A4横)</button><button data-action="p-list" aria-pressed="' + (ui.pLayout === 'list') + '">縦の一覧(A4縦)</button></div>'
    + '</div>'
    + '<div class="pick" style="margin-top:8px">' + homeRes.map(function (r) {
        return '<label class="chk"><input type="checkbox" data-bind="p-res" data-id="' + r.id + '"' + (sel.indexOf(r.id) >= 0 ? ' checked' : '') + '>' + esc(r.name) + '</label>';
      }).join('') + '</div>'
    + '<div class="row" style="margin-top:8px"><button class="btn small" data-action="p-all">全員を選ぶ</button><button class="btn small" data-action="p-none">全員を外す</button><span style="flex:1"></span>'
    + (IS_TOP ? '<button class="btn primary" data-action="print"' + (sel.length ? '' : ' disabled') + '>' + sel.length + '枚を印刷する</button>' : '<span class="small muted">このプレビュー画面では印刷できません。公開したページ(またはファイル)をパソコンのブラウザで開くと、「印刷する」ボタンが出ます。</span>')
    + '</div></div>';
  var evCount = sel.reduce(function (a, id) { return a + monthEvents(id, ui.y, ui.m).length; }, 0);
  if (!evCount && sel.length) h += '<div class="note noprint">' + ymLabel(ui.y, ui.m) + 'の予定がまだありません。「一括生成」で自動配置してから印刷してください。</div>';
  h += '<div class="small muted noprint">用紙は ' + (ui.pLayout === 'grid' ? 'A4横' : 'A4縦') + ' 1人1枚です。印刷の設定では「余白: 標準」「倍率: 100%」「背景のグラフィック: オン」にすると、色の帯まで印刷されます。</div>';
  h += '<div class="sheets">' + sel.map(function (id) { return sheetHtml(resOf(id), ui.y, ui.m, ui.pLayout, { stat: true }); }).join('') + '</div>';
  return h;
}

function dayModal(date) {
  var res = curRes(), p = date.split('-').map(Number), hol = holidays(p[0]);
  var evs = eventsOn(res.id, date), lg = legalOn(res, date), mm = mealsOf(res, date, evs);
  var ov = st.mealOv[res.id + '|' + date] || {};
  var skipped = plan(res, p[0], p[1]).skipped.filter(function (s) { return s.date === date; });
  var opt = function (cur, auto) {
    return '<option value=""' + (!cur ? ' selected' : '') + '>自動(' + (auto ? 'あり' : 'なし') + ')</option>'
      + '<option value="yes"' + (cur === 'yes' ? ' selected' : '') + '>あり</option><option value="no"' + (cur === 'no' ? ' selected' : '') + '>なし</option>';
  };
  var h = '<div class="dlg-head"><div><h2>' + esc(jpDate(date)) + (hol[date] ? ' <span style="color:var(--sun)">' + esc(hol[date]) + '</span>' : '') + '</h2>'
    + '<div class="muted small">' + esc(res.name) + '</div></div><button class="btn small" data-action="close">閉じる</button></div>';
  h += '<div><b class="small">食事</b><div class="form-grid" style="margin-top:4px">'
    + '<label class="f"><span>朝食</span><select data-bind="meal-ov" data-date="' + date + '" data-m="b">' + opt(ov.b, mm.auto.b) + '</select></label>'
    + '<label class="f"><span>夕食</span><select data-bind="meal-ov" data-date="' + date + '" data-m="d">' + opt(ov.d, mm.auto.d) + '</select></label></div></div>';
  if (!evs.length && !lg.length) h += '<div class="muted">この日の予定はありません。</div>';
  evs.forEach(function (e) {
    var rule = st.rules.filter(function (r) { return r.id === e.ruleId; })[0];
    h += '<div class="ev-row">' + chipHtml(e)
      + '<div class="small muted">' + KINDS[e.kind].label + ' / 元になった固定予定: ' + (rule ? esc(ruleSummary(rule)) : '(削除されています)') + '</div>'
      + (e.stale ? '<div class="err">今の固定予定・休業日には合わない予定です。確認して、不要なら取り除いてください。</div>' : '')
      + '<div class="ev-acts"><button class="btn small" data-action="toggle-lock" data-id="' + e.id + '">' + (e.locked ? '確定を解除' : '確定にする') + '</button>'
      + (e.stale && !e.locked ? '<button class="btn small danger" data-action="remove-stale" data-id="' + e.id + '">取り除く</button>' : '')
      + '<span class="small muted">' + (e.locked ? '確定済み。再生成しても変更されません。' : '未確定。再生成のとき固定予定の変更が反映されます。') + '</span></div></div>';
  });
  lg.forEach(function (l) {
    h += '<div class="ev-row">' + legalChipHtml(l) + '<div class="small muted">法定記録の予定です。計画書や記録の作成状況は、モニタリング管理側で別に管理します。</div></div>';
  });
  if (skipped.length) {
    h += '<div><b class="small">この日に作らなかった固定予定</b><ul class="skip-list">'
      + skipped.map(function (s) { return '<li>' + esc(s.title) + ': ' + esc(s.reason) + '</li>'; }).join('') + '</ul></div>';
  }
  return h;
}

function rulesTab() {
  var res = curRes();
  var h = '<div class="card"><div class="row">' + pickerHtml(res)
    + '<button class="btn primary" style="align-self:end" data-action="rule-new">固定予定を追加</button></div></div>';
  if (!res) return h;

function parseRoster(text) {
  var out = { rows: [], errors: [] }, curHome = null;
  var headWords = ['氏名', '名前', '区分', 'ホーム', '定員', '利用者名', '利用者'];
  text.split(/\r?\n/).forEach(function (line, ln) {
    if (!line.trim()) return;
    var cells = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/,|、/)).map(function (c) { return c.trim().replace(/^"|"$/g, ''); });
    var name = null;
    cells.forEach(function (c) {
      if (!c) return;
      var key = c.replace(/ホーム$/, '').replace(/[\s　]/g, '');
      var hit = st.homes.filter(function (h) { return h.key === key; })[0];
      if (hit) { curHome = hit; return; }
      if (name) return;
      if (/^定員\s*\d*$/.test(c) || /^[\d\s\-－ー.]+$/.test(c) || headWords.indexOf(c) >= 0) return;
      name = c.replace(/[\s　]+/g, ' ');
    });
    if (!name) return;
    if (!curHome) { out.errors.push((ln + 1) + '行目「' + name + '」: ホームが分かりません。ホーム名の列も一緒にコピーしてください。'); return; }
    out.rows.push({ homeId: curHome.id, name: name });
  });
  return out;
}

  r.staff = g('rf-staff').checked; r.staffNote = g('rf-staffnote').value.trim();
  r.skipHoliday = g('rf-skiphol').checked;
  ui.modal.applyAll = !!(g('rf-all') && g('rf-all').checked);
}
function validateRule(r) {
  if (!r.title) return '予定の名前を入れてください。';
  if (!r.weekdays.length) return '曜日を1つ以上選んでください。';
  if (!r.from) return '適用開始日を入れてください。';
  if (r.end && !r.start) return '終了時刻を入れる場合は、開始時刻も入れてください。';
  if (r.start && r.end && r.end <= r.start) return '終了時刻は開始時刻より後にしてください。';
  if (r.to && r.to < r.from) return '適用終了日は開始日より後にしてください。';
  return '';
}

/* ============================================================
   操作
   ============================================================ */
function changeResident(delta) {
  var list = residentsOf(ui.homeId), r = curRes();
  if (!r) return;
  var i = list.indexOf(r) + delta;
  if (i < 0) i = list.length - 1;
  if (i >= list.length) i = 0;
  ui.residentId = list[i].id;
}
function reopenDay(date) { render(); ui.modal = { type: 'day', date: date }; renderModal(); }

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-action]');
  if (!t) return;
  var a = t.getAttribute('data-action');
  if (a === 'scrim') { if (ev.target !== t) return; ui.modal = null; renderModal(); return; }
  var res = curRes();
  switch (a) {
    case 'tab': ui.tab = t.getAttribute('data-tab'); ui.confirmDel = null; ui.confirmDelRes = null; render(); window.scrollTo(0, 0); break;
    case 'm-prev': case 'm-next': { var s = shiftMonth(ui.y, ui.m, a === 'm-prev' ? -1 : 1); ui.y = s.y; ui.m = s.m; render(); break; }
    case 'm-next-real': { var nm = nextMonthOfToday(); ui.y = nm.y; ui.m = nm.m; render(); break; }
    case 'b-prev': case 'b-next': { var s2 = shiftMonth(ui.bulkY, ui.bulkM, a === 'b-prev' ? -1 : 1); ui.bulkY = s2.y; ui.bulkM = s2.m; render(); break; }
    case 'res-prev': changeResident(-1); render(); break;
    case 'res-next': changeResident(1); render(); break;
    case 'view-grid': ui.view = 'grid'; render(); break;
    case 'view-list': ui.view = 'list'; render(); break;
    case 'p-grid': ui.pLayout = 'grid'; render(); break;
    case 'p-list': ui.pLayout = 'list'; render(); break;
    case 'p-all': ui.pSel = null; render(); break;
    case 'p-none': ui.pSel = []; render(); break;
    case 'print': window.print(); break;
    case 'day': ui.modal = { type: 'day', date: t.getAttribute('data-date') }; renderModal(); break;
    case 'close': ui.modal = null; renderModal(); break;
    case 'toggle-lock': {
      var e = st.events.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
      if (e) { e.locked = !e.locked; save(); reopenDay(ui.modal.date); }
      break;
    }
    case 'remove-stale': {
      var id = t.getAttribute('data-id');
      st.events = st.events.filter(function (x) { return !(x.id === id && x.stale && !x.locked); });
      save(); reopenDay(ui.modal.date); break;
    }
    case 'gen-one': {
      if (!res) break;
      var c = applyPlan(st.events, res, ui.y, ui.m); save(); render();
      toast(c.added || c.updated ? ('追加 ' + c.added + '件・更新 ' + c.updated + '件。確定済みの ' + c.locked + '件は変更していません。') : '新しく増えた予定はありません(重複なし)。');
      break;
    }
    case 'gen-bulk': runBulk(); break;
    case 'rule-new': {
      if (!res) break;
      ui.modal = { type: 'rule', isNew: true, err: '', draft: { id: rid(), residentId: res.id, kind: 'day', title: '', place: '', facilityId: '', weekdays: [1, 2, 3, 4, 5], nth: [], start: '', end: '', staff: false, staffNote: '', from: ymd(ui.y, ui.m, 1), to: '', skipHoliday: false } };
      renderModal(); break;
    }
    case 'rule-edit': {
      var r0 = st.rules.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
      if (r0) { ui.modal = { type: 'rule', isNew: false, err: '', draft: JSON.parse(JSON.stringify(r0)) }; renderModal(); }
      break;
    }
    case 'rule-save': {
      readRuleForm();
      var err = validateRule(ui.modal.draft);
      if (err) { ui.modal.err = err; renderModal(); break; }
      var dr = ui.modal.draft, i = -1, wasNew = ui.modal.isNew, all = ui.modal.applyAll, extra = 0;
      st.rules.forEach(function (x, k) { if (x.id === dr.id) i = k; });
      if (i >= 0) st.rules[i] = dr; else st.rules.push(dr);
      if (wasNew && all) {
        residentsOf(res.homeId).forEach(function (o) {
          if (o.id === res.id) return;
          var cp = JSON.parse(JSON.stringify(dr)); cp.id = rid(); cp.residentId = o.id; st.rules.push(cp); extra++;
        });
      }
      ui.modal = null; save(); render();
      toast(wasNew ? '固定予定を追加しました' + (extra ? '(同じホームの ' + extra + '名にも追加)' : '') + '。「この月を自動配置」で予定に反映されます。' : '固定予定を保存しました。次の自動配置から反映されます。');
      break;
    }
    case 'rule-del': ui.confirmDel = t.getAttribute('data-id'); render(); break;
    case 'rule-del-no': ui.confirmDel = null; render(); break;
    case 'rule-del-yes': {
      var rd = t.getAttribute('data-id');
      st.rules = st.rules.filter(function (x) { return x.id !== rd; });
      ui.confirmDel = null; save(); render();
      toast('固定予定を削除しました。すでにある予定は消さず、「要確認」として残します。');
      break;
    }
    case 'rules-copy': {
      var from = resOf(document.getElementById('copy-from').value);
      if (!from || !res) break;
      var n = 0;
      st.rules.filter(function (x) { return x.residentId === from.id; }).forEach(function (x) {
        var cp = JSON.parse(JSON.stringify(x)); cp.id = rid(); cp.residentId = res.id; st.rules.push(cp); n++;
      });
      res.meals = JSON.parse(JSON.stringify(from.meals || { b: 'none', d: 'attend' }));
      save(); render(); toast(n + '件の固定予定と食事の設定をコピーしました。'); break;
    }
    case 'closed-add': {
      var fid = t.getAttribute('data-fid'), f = facOf(fid);
      var fr = document.getElementById('cf-' + fid).value, to = document.getElementById('ct-' + fid).value;
      var label = document.getElementById('cl-' + fid).value.trim();
      var er = document.getElementById('cerr-' + fid);
      if (!fr) { er.textContent = '開始日を入れてください。'; break; }
      if (to && to < fr) { er.textContent = '終了日は開始日より後にしてください。'; break; }
      f.closedDates.push({ from: fr, to: to || fr, label: label });
      f.closedDates.sort(function (x, y) { return x.from.localeCompare(y.from); });
      save(); render(); toast('休業日を追加しました。'); break;
    }
    case 'closed-del': {
      var f2 = facOf(t.getAttribute('data-fid'));
      f2.closedDates.splice(+t.getAttribute('data-i'), 1); save(); render(); break;
    }
    case 'roster-check': {
      ui.rosterText = document.getElementById('roster-text').value;
      ui.roster = parseRoster(ui.rosterText); render(); break;
    }
    case 'roster-apply': {
      if (!ui.roster || !ui.roster.rows.length) break;
      var rows = ui.roster.rows;
      if (ui.rosterReplace) { st.residents = []; st.rules = []; st.events = []; st.notes = {}; st.mealOv = {}; }
      st.sample = false;
      var added = 0;
      rows.forEach(function (x) {
        if (st.residents.some(function (r) { return r.homeId === x.homeId && r.name === x.name; })) return;
        st.residents.push(newResident(x.homeId, x.name)); added++;
      });
      ui.roster = null; ui.rosterText = ''; ui.residentId = null; ui.pSel = null;
      var first = st.residents[0]; if (first) ui.homeId = first.homeId;
      save(); render();
      toast(added + '名を取り込みました。次は「固定予定」で1人分を登録し、他の人にコピーしてください。'); break;
    }
    case 'res-add': {
      var nmv = document.getElementById('add-name').value.trim().replace(/[\s　]+/g, ' ');
      var er2 = document.getElementById('add-err');
      if (!nmv) { er2.textContent = '氏名を入れてください。'; break; }
      var hid = document.getElementById('add-home').value;
      if (st.residents.some(function (r) { return r.homeId === hid && r.name === nmv; })) { er2.textContent = '同じホームに同じ氏名がすでにいます。'; break; }
      st.residents.push(newResident(hid, nmv)); st.sample = false; save(); render(); toast('追加しました。'); break;
    }
    case 'res-del': ui.confirmDelRes = t.getAttribute('data-id'); render(); break;
    case 'res-del-no': ui.confirmDelRes = null; render(); break;
    case 'res-del-yes': {
      var did = t.getAttribute('data-id');
      st.residents = st.residents.filter(function (r) { return r.id !== did; });
      st.rules = st.rules.filter(function (r) { return r.residentId !== did; });
      st.events = st.events.filter(function (r) { return r.residentId !== did; });
      ui.confirmDelRes = null; ui.residentId = null; save(); render(); toast('削除しました。'); break;
    }
    case 'backup-copy': {
      var json = JSON.stringify(st);
      var done = function () { toast('バックアップをコピーしました。メモ帳などに貼り付けて保管してください。'); };
      var fail = function () {
        var ta = document.getElementById('restore-text'); ta.value = json; ta.focus(); ta.select();
        toast('自動でコピーできませんでした。下の欄に出した文字を、手動でコピーしてください。');
      };
      try { navigator.clipboard.writeText(json).then(done, fail); } catch (e2) { fail(); }
      break;
    }
    case 'backup-restore': {
      var er3 = document.getElementById('restore-err');
      try {
        var o = JSON.parse(document.getElementById('restore-text').value);
        if (!o || o.version !== DATA_VER || !o.residents || !o.rules || !o.homes) throw new Error('形式が違います');
        st = o; save(); ui.residentId = null; ui.roster = null; render(); toast('バックアップから戻しました。');
      } catch (e3) { er3.textContent = 'バックアップの文字を読み取れませんでした。コピーした内容をそのまま貼り付けてください。'; }
      break;
    }
    case 'reset': ui.confirmReset = true; render(); break;
    case 'reset-no': ui.confirmReset = false; render(); break;
    case 'reset-yes': {
      st = fresh(); save(); ui.confirmReset = false; ui.bulk = null; ui.modal = null; ui.residentId = null; ui.homeId = 'h1'; ui.pSel = null; ui.roster = null; render();
      toast('サンプルデータに戻しました。'); break;
    }
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && ui.modal) { ui.modal = null; renderModal(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role="button"][data-action="day"]')) {
    ev.preventDefault(); ev.target.click();
  }
});
document.addEventListener('change', function (ev) {
  var t = ev.target, b = t.getAttribute && t.getAttribute('data-bind');
  if (!b) return;
  switch (b) {
    case 'home': ui.homeId = t.value; ui.residentId = null; ui.pSel = null; render(); break;
    case 'res': ui.residentId = t.value; render(); break;
    case 'legal': ui.showLegal = t.checked; render(); break;
    case 'fac-wd': {
      var f = facOf(t.getAttribute('data-fid')), w = +t.getAttribute('data-wd');
      f.closedWeekdays = f.closedWeekdays.filter(function (x) { return x !== w; });
      if (t.checked) f.closedWeekdays.push(w);
      save(); break;
    }
    case 'fac-hol': facOf(t.getAttribute('data-fid')).closedOnHoliday = t.checked; save(); break;
    case 'b-home': {
      var sel = ui.bulkHomes || st.homes.map(function (x) { return x.id; });
      var hid = t.getAttribute('data-hid');
      sel = sel.filter(function (x) { return x !== hid; });
      if (t.checked) sel.push(hid);
      ui.bulkHomes = sel; break;
    }
    case 'b-dry': ui.bulkDry = t.checked; render(); break;
    case 'p-res': {
      var homeRes = residentsOf(ui.homeId).map(function (r) { return r.id; });
      var cur = ui.pSel === null ? homeRes.slice() : ui.pSel.slice();
      var id = t.getAttribute('data-id');
      cur = cur.filter(function (x) { return x !== id; });
      if (t.checked) cur.push(id);
      ui.pSel = homeRes.filter(function (x) { return cur.indexOf(x) >= 0; }); render(); break;
    }
    case 'meal-mode': {
      var res = curRes(); res.meals = res.meals || { b: 'none', d: 'attend' };
      res.meals[t.getAttribute('data-m')] = t.value; save(); toast('食事の基本設定を保存しました。'); break;
    }
    case 'meal-ov': {
      var res2 = curRes(), date = t.getAttribute('data-date'), key = res2.id + '|' + date, mk = t.getAttribute('data-m');
      var o = st.mealOv[key] || {};
      if (t.value) o[mk] = t.value; else delete o[mk];
      if (o.b || o.d) st.mealOv[key] = o; else delete st.mealOv[key];
      save(); reopenDay(date); break;
    }
    case 'roster-replace': ui.rosterReplace = t.checked; break;
  }
});
document.addEventListener('input', function (ev) {
  var id = ev.target.id;
  if (id !== 'note-top' && id !== 'note-foot') return;
  var res = curRes(), v = ev.target.value, field = id === 'note-top' ? 'top' : 'foot';
  setNote(res, field, ui.y, ui.m, v);
  var el = document.querySelector('[data-role="note-' + field + '"]');
  if (el) el.textContent = v;
  if (field === 'foot') document.getElementById('note-count').textContent = '連絡帯 ' + v.length + ' / 200文字(印刷で切れない長さにしています)';
});

function runBulk() {
  var sel = ui.bulkHomes || st.homes.map(function (x) { return x.id; });
  if (!sel.length) { toast('ホームを1つ以上選んでください。'); return; }
  var dry = ui.bulkDry;
  var events = dry ? JSON.parse(JSON.stringify(st.events)) : st.events;
  var rows = [];
  st.homes.filter(function (h) { return sel.indexOf(h.id) >= 0; }).forEach(function (h) {
    var row = { name: h.name, n: 0, added: 0, updated: 0, kept: 0, locked: 0, skipped: 0, stale: 0 };
    residentsOf(h.id).forEach(function (r) {
      var c = applyPlan(events, r, ui.bulkY, ui.bulkM);
      row.n++;
      ['added', 'updated', 'kept', 'locked', 'skipped', 'stale'].forEach(function (k) { row[k] += c[k]; });
    });
    rows.push(row);
  });
  if (!dry) { st.events = events; save(); }
  ui.bulk = { y: ui.bulkY, m: ui.bulkM, rows: rows, dry: dry };
  render();
}

/* ============================================================
   起動
   ============================================================ */
st = load();
render();

})();
</script>
