<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="app-ver" content="2026-11-09c">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="従業員名簿">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="roster-manifest.json">
<link rel="icon" type="image/png" href="roster-icon-192.png">
<link rel="apple-touch-icon" href="roster-apple-touch-icon.png">
<title>従業員名簿 | おりーぶ庵</title>
<!--
  従業員名簿アプリ（名簿は閲覧のみ。資格書のPDFだけ保存できる）

  このファイルには名簿のデータを一切入れない。
  このリポジトリは公開されているため、データは Google スプレッドシート側に置き、
  合言葉を送って GAS から受け取る（設定は「従業員名簿アプリGAS.md」を参照）。
  個人番号（マイナンバー）は GAS 側で送らない作りにしてある。
-->
<style>
:root{
  --green:#2e7d32; --green-d:#1b5e20; --green-l:#e8f5e9;
  --ink:#1f2a24; --sub:#5f6b64; --line:#dfe5e1; --bg:#f4f6f4; --card:#fff;
  --warn:#c62828; --warn-l:#fdecea;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* ログイン */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-box{width:100%;max-width:380px;background:var(--card);border-radius:16px;padding:28px 22px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.login-box h1{margin:0 0 4px;font-size:22px;color:var(--green-d)}
.login-box p{margin:0 0 18px;color:var(--sub);font-size:14px}
.login-box label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.login-box input{width:100%;padding:13px 12px;font-size:17px;border:1.5px solid var(--line);border-radius:10px}
.login-box input:focus,.tools input:focus,.tools select:focus{outline:none;border-color:var(--green)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font-weight:700;font-size:16px;margin-top:12px}
.btn-pri{background:var(--green);color:#fff}
.btn-pri:disabled{opacity:.6}
.btn-sub{background:#fff;color:var(--green-d);border:1.5px solid var(--green)}
.msg{margin-top:12px;font-size:14px;color:var(--warn);min-height:20px}
.note{margin-top:16px;font-size:12px;color:var(--sub)}

/* ヘッダ */
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow h1{margin:0;font-size:18px}
.hbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:14px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:8px 4px;font-weight:700;font-size:14px}
.tab.on{background:#fff;color:var(--green-d)}
.demo-bar{background:#fff8e1;color:#795500;font-size:13px;padding:6px 16px;text-align:center}

/* 検索 */
.tools{padding:12px 16px 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:900px;margin:0 auto}
.tools input,.tools select{width:100%;padding:11px 10px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.tools .full{grid-column:1/-1}
.count{padding:6px 16px;color:var(--sub);font-size:13px;max-width:900px;margin:0 auto}

/* 一覧 */
#list{max-width:900px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom));display:grid;gap:8px}
@media(min-width:700px){#list{grid-template-columns:1fr 1fr}}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item:active{background:var(--green-l)}
.item .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.item .nm{font-weight:700;font-size:17px}
.item .no{color:var(--sub);font-size:12px}
.item .kana{color:var(--sub);font-size:12px}
.item .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.chip{background:var(--green-l);color:var(--green-d);border-radius:999px;padding:2px 9px}
.chip.gray{background:#eceff1;color:#455a64}
.empty{padding:40px 16px;text-align:center;color:var(--sub)}

/* 詳細 */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){#sheetBg{align-items:center}#sheet{border-radius:18px}}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.s-head h2{margin:0;font-size:21px}
.s-head .kana{color:var(--sub);font-size:13px}
.x{background:#eceff1;border:0;border-radius:50%;width:34px;height:34px;font-size:18px;flex:none}
dl{margin:14px 0 0}
.row{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row dt{color:var(--sub);font-size:13px;padding-top:2px}
.row dd{margin:0;white-space:pre-wrap;word-break:break-word}
.row dd a{color:var(--green-d);font-weight:700}
.row dd small{color:var(--sub)}

/* 資格書 */
.q-head{margin:20px 0 6px;font-size:15px;font-weight:700;color:var(--green-d)}
.q-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.q-title{font-weight:700}
.q-dates{color:var(--sub);font-size:13px;margin-top:2px}
.q-badge{display:inline-block;margin-left:6px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.q-badge.ng{background:var(--warn-l);color:var(--warn)}
.q-badge.soon{background:#fff3e0;color:#b45309}
.q-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.q-btn{background:#fff;color:var(--green-d);border:1.5px solid var(--green);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:700}
.q-btn.pri{background:var(--green);color:#fff}
.q-btn:disabled{opacity:.6}
.q-none{color:var(--sub);font-size:14px;padding:4px 0 10px}
.q-form{border:1.5px dashed var(--green);border-radius:10px;padding:12px;margin-top:10px}
.q-form summary{cursor:pointer;font-weight:700;color:var(--green-d)}
.q-form label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.q-form input{width:100%;padding:10px;font-size:16px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.q-msg{margin-top:8px;font-size:14px;min-height:20px}
.q-msg.err{color:var(--warn)} .q-msg.ok{color:var(--green-d)}
.q-note{margin-top:6px;font-size:12px;color:var(--sub)}
.act-head{margin:22px 0 6px;font-size:15px;font-weight:700;color:var(--warn)}
.act-btn{display:block;width:100%;background:#fff;color:var(--warn);border:1.5px solid var(--warn);border-radius:10px;padding:12px;font-size:16px;font-weight:700}
.act-btn.plain{color:var(--green-d);border-color:var(--green)}
.act-box{border:1.5px solid var(--warn);border-radius:10px;padding:12px;background:#fffafa}
.act-box label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.act-box input{width:100%;padding:10px;font-size:16px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.act-msg{margin:10px 0;font-size:15px;line-height:1.7}
.act-row{display:flex;gap:8px;margin-top:10px}
.act-row button{flex:1;padding:12px;border-radius:10px;font-size:16px;font-weight:700;border:1.5px solid var(--line);background:#fff}
.act-row .go{background:var(--warn);color:#fff;border-color:var(--warn)}
.act-row button:disabled{opacity:.6}
.site-btns{display:flex;flex-wrap:wrap;gap:8px}
.site-btn{border:0;border-radius:10px;padding:11px 14px;font-size:16px;color:#222;min-width:calc(33.3% - 6px);flex:1 1 auto;line-height:1.2}
.site-btn small{display:block;font-size:12px;opacity:.75;margin-top:2px}
.site-btn.all{background:#fff;border:1.5px solid var(--line)}
.site-btn.on{outline:3px solid #1f2a24;outline-offset:1px;font-weight:700}
.chip.home{color:#222}
.ver{font-size:11px;font-weight:400;opacity:.8;margin-left:6px}
.upd-bar{background:#fff3cd;color:#7a5a00;padding:8px 16px;text-align:center;font-size:14px}
.upd-bar button{margin-left:8px;border:0;background:#7a5a00;color:#fff;border-radius:8px;padding:5px 12px;font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:12px 18px;border-radius:10px;z-index:40;font-size:15px;max-width:90%;text-align:center}
#pdfBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:center;justify-content:center;padding:0}
#pdfBox{background:#fff;width:100%;height:100%;max-width:900px;display:flex;flex-direction:column}
@media(min-width:700px){#pdfBg{padding:20px}#pdfBox{border-radius:12px;overflow:hidden}}
.pdf-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.pdf-bar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-bar a{color:var(--green-d);font-weight:700;font-size:14px;white-space:nowrap}
#pdfFrame{flex:1;width:100%;border:0}
</style>
</head>
<body>

<section id="login">
  <form class="login-box" id="loginForm" autocomplete="off">
    <h1>従業員名簿</h1>
    <p>おりーぶ庵株式会社（管理者用）</p>
    <label for="pass">合言葉</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn btn-pri" id="loginBtn" type="submit">開く</button>
    <button class="btn btn-sub" id="demoBtn" type="button">サンプルデータで試す</button>
    <div class="msg" id="loginMsg" role="alert"></div>
    <div class="note">名簿の中身はこのページには入っていません。合言葉が合ったときだけ、Googleスプレッドシートから受け取ります。個人番号は受け取りません。<br><span id="verLogin"></span></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <div class="hrow">
      <h1>従業員名簿<span class="ver" id="verText"></span></h1>
      <div>
        <button class="hbtn" id="reloadBtn" type="button">更新</button>
        <button class="hbtn" id="logoutBtn" type="button">閉じる</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="active" type="button"></button>
      <button class="tab" data-tab="left" type="button"></button>
    </div>
  </header>
  <div class="upd-bar hidden" id="updBar">新しい版があります。<button id="updBtn" type="button">読み込み直す</button></div>
  <div class="demo-bar hidden" id="demoBar">サンプルデータ（架空の人物）を表示しています</div>
  <div class="tools">
    <input class="full" id="q" type="search" placeholder="氏名・カナ・役職・資格で検索">
    <div class="full site-btns" id="siteBtns" role="group" aria-label="拠点"></div>
    <select class="full" id="fType"><option value="">常勤・非常勤：すべて</option></select>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</section>

<div id="toast" class="hidden" role="status"></div>

<div id="pdfBg" class="hidden"><div id="pdfBox">
  <div class="pdf-bar"><b id="pdfTitle"></b><a id="pdfOpen" target="_blank" rel="noopener">Googleドライブで開く</a><button class="x" id="pdfClose" type="button" aria-label="閉じる">×</button></div>
  <iframe id="pdfFrame" title="資格書のプレビュー"></iframe>
</div></div>

<div id="sheetBg" class="hidden"><div id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";

// 名簿用GASの「ウェブアプリのURL」をここに設定する（手順は「従業員名簿アプリGAS.md」）
const GAS_URL = "https://script.google.com/macros/s/AKfycbw-9rRr_B2ieY_fv3uYIBWgqeFaPPxjTKJW5Oe_JO0p8evT1YDJKVXimr_XDhgV3SmM-g/exec";

const PASS_KEY = "roster-pass";   // タブを閉じると消える sessionStorage にだけ置く
const TIMEOUT_MS = 20000;

const $ = (id) => document.getElementById(id);
const store = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
};

let DATA = { active: [], left: [], quals: [] };
let tab = "active";
let demo = false;

/* ---------- 日付・計算 ---------- */
function parseDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ""));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
// 満年齢
function ageOf(birth, base){
  const b = parseDate(birth); if (!b) return null;
  const t = base || new Date();
  let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a < 0 ? null : a;
}
// 入社日から基準日までの「○年○ヶ月」
function tenureOf(from, to){
  const f = parseDate(from); if (!f) return null;
  const t = to ? parseDate(to) : new Date(); if (!t || t < f) return null;
  let months = (t.getFullYear() - f.getFullYear()) * 12 + (t.getMonth() - f.getMonth());
  if (t.getDate() < f.getDate()) months--;
  if (months < 0) months = 0;
  return Math.floor(months / 12) + "年" + (months % 12) + "ヶ月";
}
function wareki(s){
  const d = parseDate(s); if (!d) return s || "";
  return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
}
// 日付として入っていれば和暦でなく西暦の日本語表記に、文章ならそのまま
function showMaybeDate(s){ return parseDate(s) ? wareki(s) : (s || ""); }

/* ---------- GAS から受け取る（JSONP） ---------- */
function pickData(res){
  return { active: res.active || [], left: res.left || [], quals: res.quals || [] };
}
// GAS へ問い合わせる（JSONP）。params の action と pass はここで付ける
function fetchGas(params){
  return new Promise((resolve, reject) => {
    const cb = "rosterCb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const script = document.createElement("script");
    let done = false;
    const finish = (fn, v) => {
      if (done) return; done = true;
      clearTimeout(timer); delete window[cb]; script.remove(); fn(v);
    };
    const timer = setTimeout(() => finish(reject, new Error("時間内に届きませんでした。通信を確認してもう一度お試しください。")), TIMEOUT_MS);
    window[cb] = (res) => finish(resolve, res);
    script.onerror = () => finish(reject, new Error("名簿を受け取れませんでした。GASのURLと公開設定を確認してください。"));
    const qs = Object.keys(params).map((k) => k + "=" + encodeURIComponent(params[k])).join("&");
    script.src = GAS_URL + "?" + qs + "&callback=" + cb + "&_=" + Date.now();
    document.head.appendChild(script);
  });
}
function fetchRoster(pass){ return fetchGas({ action: "roster", pass: pass }); }

async function openRoster(pass, silent){
  const btn = $("loginBtn");
  btn.disabled = true; $("loginMsg").textContent = "";
  try{
    if (!GAS_URL || GAS_URL === "YOUR_ROSTER_GAS_URL")
      throw new Error("名簿用GASのURLが未設定です。設定するまでは「サンプルデータで試す」だけ使えます。");
    const res = await fetchRoster(pass);
    if (!res || !res.ok) throw new Error((res && res.error) || "合言葉が違います。");
    DATA = pickData(res);
    demo = false;
    store.set(PASS_KEY, pass);
    showApp();
  }catch(e){
    store.del(PASS_KEY);
    if (silent) { showLogin(); } else { $("loginMsg").textContent = e.message; }
  }finally{
    btn.disabled = false;
  }
}

/* ---------- 画面切り替え ---------- */
function showApp(){
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("demoBar").classList.toggle("hidden", !demo);
  fillFilters(); render();
}
function showLogin(){
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("pass").value = ""; closeSheet();
}
function logout(){ store.del(PASS_KEY); DATA = { active: [], left: [], quals: [] }; demo = false; showLogin(); }

/* ---------- 一覧 ---------- */
function uniq(list, key){
  return [...new Set(list.map((p) => (p[key] || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ja"));
}
function fillFilters(){
  const keep = { t: $("fType").value };
  const all = DATA.active.concat(DATA.left);
  const set = (el, label, vals, cur) => {
    el.innerHTML = "";
    el.add(new Option(label, ""));
    vals.forEach((v) => el.add(new Option(v, v)));
    el.value = vals.includes(cur) ? cur : "";
  };
  set($("fType"), "常勤・非常勤：すべて", uniq(all, "type"), keep.t);
}
// 拠点の色（ホームページの「事務所情報」ボタンの色にそろえている）
const HOMES = [
  { n: "西九条", c: "#ffa500" }, { n: "九条", c: "#cd853f" }, { n: "酉島", c: "#ff69b4" },
  { n: "春日出", c: "#40e0d0" }, { n: "新郡山", c: "#7cfc00" }, { n: "出来島", c: "#ffff00" },
  { n: "本部", c: "#dfe5e1" }
];
let siteSel = "";
// 「西九条・九条」のように兼務の書き方があるので、区切って1つずつ数える
// （「九条」で「西九条」まで拾わないよう、文字の一部ではなく、1つずつの名前で比べる）
function siteTokens(p){ return String(p.site || "").split(/[・,、\/／\s\u3000]+/).map((x) => x.trim()).filter(Boolean); }
function homeColor(name){ const h = HOMES.find((x) => x.n === name); return h ? h.c : ""; }
function renderSiteBtns(){
  const box = $("siteBtns"); box.innerHTML = "";
  const count = (n) => DATA.active.filter((p) => siteTokens(p).includes(n)).length;
  const add = (label, key, color, n) => {
    const b = el("button", "site-btn" + (key ? "" : " all") + (siteSel === key ? " on" : ""));
    b.type = "button"; if (color) b.style.background = color;
    b.appendChild(document.createTextNode((siteSel === key ? "✓ " : "") + label));
    if (n != null) b.appendChild(el("small", "", n + "名"));
    b.setAttribute("aria-pressed", siteSel === key ? "true" : "false");
    b.addEventListener("click", () => { siteSel = (siteSel === key ? "" : key); render(); });
    box.appendChild(b);
  };
  add("すべて", "", "", DATA.active.length);
  HOMES.forEach((h) => add(h.n, h.n, h.c, count(h.n)));
}

// 空白をなくし、ひらがなをカタカナにそろえる（「すずき」で「スズキ」も探せるように）
function fold(s){
  return String(s || "").replace(/[\s　]+/g, "").toLowerCase()
    .replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
function visible(){
  const q = fold($("q").value);
  const type = $("fType").value;
  const src = DATA[tab] || [];
  return src.filter((p) => {
    if (type && (p.type || "").trim() !== type) return false;
    if (tab === "active" && siteSel && !siteTokens(p).includes(siteSel)) return false;
    if (!q) return true;
    return fold([p.name, p.kana, p.role, p.site, p.resume, p.line].join("")).includes(q);
  });
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function render(){
  const tabs = document.querySelectorAll(".tab");
  tabs[0].textContent = "在籍 " + DATA.active.length + "名";
  tabs[1].textContent = "退職者 " + DATA.left.length + "名";
  tabs.forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("siteBtns").classList.toggle("hidden", tab !== "active");
  renderSiteBtns();

  const rows = visible();
  $("count").textContent = rows.length + "名を表示";
  const box = $("list"); box.innerHTML = "";
  if (!rows.length){ box.appendChild(el("div", "empty", "該当する人がいません")); return; }
  const frag = document.createDocumentFragment();
  rows.forEach((p) => {
    const b = el("button", "item"); b.type = "button";
    const top = el("div", "top");

/* ---------- 資格書（PDFの保存とプレビュー） ---------- */
const PDF_MAX_BYTES = 10 * 1024 * 1024;   // GAS側の上限（base64で約14MB）に収まる大きさ
const QUAL_NAMES = ["介護福祉士", "実務者研修", "初任者研修", "ヘルパー２級", "看護師", "強度行動障害養成研修（基礎）", "強度行動障害養成研修（実践）", "重度訪問介護従事者養成研修", "同行援護従業者養成研修", "行動援護従業者養成研修"];

function nameKey(s){ return String(s || "").replace(/[\s　]+/g, ""); }
function qualsOf(p){
  return (DATA.quals || []).filter((q) => nameKey(q.name) === nameKey(p.name))
    .sort((a, b) => String(b.acquired || "").localeCompare(String(a.acquired || "")));
}
function daysLeft(ymd){
  const d = parseDate(ymd); if (!d) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((d - t) / 86400000);
}
function driveId(url){
  const m = /^https:\/\/drive\.google\.com\/file\/d\/([\w-]+)/.exec(String(url || ""));
  return m ? m[1] : "";
}
function setMsg(box, text, kind){ box.textContent = text || ""; box.className = "q-msg" + (kind ? " " + kind : ""); }

function renderQuals(box, p, notice){
  box.innerHTML = "";
  box.appendChild(el("div", "q-head", "資格書"));
  if (notice){ const n = el("div", "q-msg ok", notice); box.appendChild(n); }
  const list = qualsOf(p);
  if (!list.length) box.appendChild(el("div", "q-none", "登録された資格書はありません"));
  list.forEach((q) => {
    const item = el("div", "q-item");
    const title = el("div", "q-title", q.title);
    const left = daysLeft(q.renew);
    if (left != null && left < 0) title.appendChild(el("span", "q-badge ng", "更新期限が過ぎています"));
    else if (left != null && left <= 60) title.appendChild(el("span", "q-badge soon", "更新まであと" + left + "日"));
    item.appendChild(title);
    const dates = [q.acquired ? "取得 " + wareki(q.acquired) : "", q.renew ? "更新 " + wareki(q.renew) : ""].filter(Boolean).join("　／　");
    if (dates) item.appendChild(el("div", "q-dates", dates));
    const acts = el("div", "q-acts");
    if (driveId(q.pdf)){
      const v = el("button", "q-btn pri", "PDFを見る"); v.type = "button";
      v.addEventListener("click", () => openPdf(q));
      acts.appendChild(v);
    }
    const r = el("button", "q-btn", "更新日を変更"); r.type = "button";
    r.addEventListener("click", () => changeRenew(q, p, box, r));
    acts.appendChild(r);
    item.appendChild(acts);
    box.appendChild(item);
  });
  box.appendChild(qualForm(p, box));
  box.appendChild(el("div", "q-note", "PDFは、保存先のフォルダを共有しているGoogleアカウントでログインしていると見られます。"));
}

function qualForm(p, box){
  const f = el("details", "q-form");
  f.appendChild(el("summary", "", "＋ 資格を追加"));
  const dl = el("datalist"); dl.id = "qualNames";
  QUAL_NAMES.forEach((n) => dl.appendChild(new Option(n)));
  f.appendChild(dl);
  const field = (label, type, attrs) => {
    f.appendChild(el("label", "", label));
    const i = el("input"); i.type = type; Object.keys(attrs || {}).forEach((k) => i.setAttribute(k, attrs[k]));
    f.appendChild(i); return i;
  };
  const title = field("資格名（必須）", "text", { list: "qualNames", maxlength: "100", placeholder: "例：介護福祉士" });
  const acq = field("取得年月日", "date");
  const ren = field("更新日（更新のある資格だけ）", "date");
  const pdf = field("資格書のPDF", "file", { accept: "application/pdf,.pdf" });
  const save = el("button", "q-btn pri", "保存する"); save.type = "button"; save.style.marginTop = "12px"; save.style.width = "100%";
  const msg = el("div", "q-msg"); msg.setAttribute("role", "alert");
  f.appendChild(save); f.appendChild(msg);

  save.addEventListener("click", async () => {
    const t = title.value.trim();
    const file = pdf.files[0];
    if (!t) return setMsg(msg, "資格名を入れてください。", "err");
    if (file && file.size > PDF_MAX_BYTES) return setMsg(msg, "PDFが大きすぎます（10MBまで）。", "err");
    if (file && !/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return setMsg(msg, "PDFファイルを選んでください。", "err");
    save.disabled = true; setMsg(msg, file ? "保存しています…（PDFが大きいと少し時間がかかります）" : "保存しています…");
    try{
      const body = { action: "qualAdd", pass: store.get(PASS_KEY) || "", name: p.name, no: p.no || "", title: t, acquired: acq.value, renew: ren.value };
      if (demo){
        DATA.quals.push({ row: 0, name: p.name, no: p.no || "", title: t, acquired: acq.value, renew: ren.value, pdf: "" });
      } else {
        if (file) body.pdf = await fileToBase64(file);
        await postQual(body, p);
      }
      renderQuals(box, p, demo ? "追加しました（サンプルのため、PDFは保存されません）。" : "保存しました。");
    }catch(e){
      setMsg(msg, e.message, "err");
    }finally{
      save.disabled = false;
    }
  });
  return f;
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = () => reject(new Error("PDFを読み込めませんでした。"));
    r.readAsDataURL(file);
  });
}

// 資格の追加を GAS へ送る。結果が読めないときは、名簿を読み直して、増えたかで確かめる
async function postQual(body, p){
  const before = qualsOf(p).length;
  let result = null;
  try{
    const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    result = await res.json();
  }catch(e){ result = null; }
  if (result && !result.ok) throw new Error(result.error || "保存できませんでした。");
  const fresh = await fetchRoster(store.get(PASS_KEY) || "");
  if (!fresh || !fresh.ok) throw new Error("保存後の名簿を読み込めませんでした。右上の「更新」を押してください。");
  DATA = pickData(fresh);
  if (!result && qualsOf(p).length <= before) throw new Error("保存できたか確認できませんでした。右上の「更新」を押して確かめてください。");
}

async function changeRenew(q, p, box, btn){
  const cur = q.renew || "";
  const v = prompt("更新日を入れてください（例 2027-04-01）。空にすると消えます。", cur);
  if (v == null) return;
  const t = v.trim();
  if (t && !parseDate(t)) return alert("日付は 2027-04-01 の形で入れてください。");
  btn.disabled = true;
  try{
    if (demo){ q.renew = t; }
    else {
      const res = await fetchGas({ action: "qualRenew", pass: store.get(PASS_KEY) || "", name: q.name, row: q.row, date: t });
      if (!res || !res.ok) throw new Error((res && res.error) || "変更できませんでした。");
      const fresh = await fetchRoster(store.get(PASS_KEY) || "");
      if (fresh && fresh.ok) DATA = pickData(fresh); else q.renew = t;
    }
    renderQuals(box, p);
  }catch(e){ alert(e.message); btn.disabled = false; }
}

  $("pdfTitle").textContent = q.name + "　" + q.title;

   スマホやiPadのブラウザは、前に見た画面を覚えていることがある。
   公開中のページの先頭だけを読み直して、版番号が違えば読み込み直す。 */
const APP_VER = (document.querySelector('meta[name="app-ver"]') || {}).content || "";
$("verText").textContent = APP_VER ? "版 " + APP_VER : "";
$("verLogin").textContent = APP_VER ? "画面の版：" + APP_VER : "";
let verCheckedAt = 0;
function hardReload(){ location.replace(location.pathname + "?v=" + Date.now()); }
async function checkNewVersion(){
  if (!APP_VER || Date.now() - verCheckedAt < 60000) return;
  verCheckedAt = Date.now();
  let head;
  try{
    const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store", headers: { Range: "bytes=0-4095" } });
    if (!r.ok) return;
    head = await r.text();
  }catch(e){ return; }                       // 電波が悪いときは何もしない
  const m = head.match(/name="app-ver"\s+content="([^"]+)"/);
  if (!m || m[1] === APP_VER) return;
  const opened = !$("sheetBg").classList.contains("hidden");
  let once = true;
  try{ once = !sessionStorage.getItem("rosterVerReloaded"); sessionStorage.setItem("rosterVerReloaded", "1"); }catch(e){}
  if (!opened && once) { hardReload(); return; }   // 開いている途中でなければ、黙って新しくする
  $("updBar").classList.remove("hidden");           // 入力の途中なら、お知らせだけ出す
}
$("updBtn").addEventListener("click", hardReload);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewVersion(); });
checkNewVersion();

// 同じタブで開き直したときは合言葉を覚えているので、そのまま開く
const savedPass = store.get(PASS_KEY);
if (savedPass) openRoster(savedPass, true);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
