<!--
  おりーぶ庵 AI-OS  ―  デモ画面（見た目レイヤー） Ver 0.1
  ------------------------------------------------------------------
  ★これは「見た目」だけのデモです。★
  ・AI社員が会社マップの上を自律的に歩き回ります。
  ・社長室の入力欄に指示を出すと、担当AIが集まって相談し、
    成果物カードが「完成トレイ」に出てくる様子を再現します。
  ・まだ本当の業務処理（実データの集計・書類作成）は入っていません。
    それは次の段階で、1業務ずつ中身を入れていきます。

  既存の index.html（シフト希望フォーム）とは独立した別ファイルです。
  1ファイルで完結しているので、そのままブラウザで開けます。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おりーぶ庵 AI-OS（デモ）</title>
<style>
  :root{
    --olive:#5a7d3c; --olive-d:#3f5a29; --olive-l:#e8f0dd;
    --ink:#26301c; --paper:#f6f8f1; --line:#d7e0c8;
    --gold:#c99a2e;
    /* 状態カラー */
    --s-idle:#9aa38c; --s-move:#3d78c9; --s-work:#3a9d5d;
    --s-talk:#8a5cc9; --s-done:#c99a2e; --s-rest:#2ea3a3; --s-err:#d0503f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    color:var(--ink); background:#eef2e6; -webkit-text-size-adjust:100%;
  }

  /* ===== ヘッダー ===== */
  header{
    background:linear-gradient(180deg,var(--olive),var(--olive-d));
    color:#fff; padding:10px 16px; display:flex; align-items:center; gap:14px;
    flex-wrap:wrap;
  }
  header .logo{font-size:20px; font-weight:800; letter-spacing:.5px}
  header .tag{font-size:11px; background:rgba(255,255,255,.18); padding:2px 8px; border-radius:999px}
  header .tiles{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}
  .tile{
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
    border-radius:10px; padding:6px 10px; min-width:78px; text-align:center;
  }
  .tile b{display:block; font-size:16px; line-height:1.1}
  .tile span{font-size:10px; opacity:.9}

  .wrap{max-width:1180px; margin:0 auto; padding:12px; display:grid;
    grid-template-columns: 1fr 300px; gap:12px}
  @media(max-width:880px){ .wrap{grid-template-columns:1fr} }

  /* ===== フロア（会社マップ） ===== */
  .stage{
    position:relative; width:100%; aspect-ratio:16/10; min-height:380px;
    background:
      radial-gradient(120% 90% at 50% 0%, #fbfdf7, #eef3e3 60%, #e3ebd4);
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    box-shadow:inset 0 0 0 6px #fff, 0 6px 20px rgba(60,80,40,.12);
  }
  /* うっすら床の格子 */
  .stage::before{
    content:""; position:absolute; inset:0;
    background-image:linear-gradient(rgba(90,125,60,.06) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(90,125,60,.06) 1px,transparent 1px);
    background-size:6.25% 10%; pointer-events:none;
  }

  /* 部屋・ゾーン */
  .zone{position:absolute; transform:translate(-50%,-50%); text-align:center; pointer-events:none}
  .plaque{
    display:inline-block; background:#fff; border:1px solid var(--line);
    border-radius:8px; padding:2px 8px; font-size:11px; font-weight:700;
    color:var(--olive-d); box-shadow:0 2px 4px rgba(0,0,0,.06); white-space:nowrap;
  }
  .desk{font-size:20px; margin-top:2px; filter:drop-shadow(0 2px 1px rgba(0,0,0,.15))}

  /* 社長室 */
  .president{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:32%; min-width:230px; max-width:340px;
    background:linear-gradient(180deg,#fffdf5,#fff7e4);
    border:2px solid var(--gold); border-radius:16px; padding:10px 12px 12px;
    box-shadow:0 8px 22px rgba(150,120,20,.20); z-index:5; text-align:center;
  }
  .president h2{margin:0 0 2px; font-size:14px; color:#7a5c12}
  .president p{margin:0 0 8px; font-size:10.5px; color:#8a7333}
  .cmdrow{display:flex; gap:6px}
  .cmdrow input{
    flex:1; border:1px solid var(--gold); border-radius:10px; padding:8px 10px;
    font-size:13px; outline:none; background:#fff;
  }
  .cmdrow button{
    border:none; background:var(--olive); color:#fff; font-weight:700;
    border-radius:10px; padding:8px 12px; cursor:pointer; font-size:13px;
  }
  .cmdrow button:active{transform:translateY(1px)}
  .chips{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:7px}
  .chip{
    font-size:10.5px; background:#fff; border:1px solid var(--line);
    border-radius:999px; padding:3px 8px; cursor:pointer; color:var(--olive-d);
  }
  .chip:hover{background:var(--olive-l)}

  /* ===== AI社員 ===== */
  .staff{position:absolute; transform:translate(-50%,-50%); z-index:4;
    text-align:center; transition:filter .2s; will-change:left,top}
  .staff .avatar{font-size:26px; line-height:1; filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
  .staff.walking .avatar{animation:bob .45s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .staff .badge{
    margin-top:1px; font-size:9.5px; font-weight:700; color:#fff;
    background:var(--olive-d); border-radius:999px; padding:1px 6px; white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.2)
  }
  .staff .state{
    margin-top:2px; font-size:8.5px; font-weight:700; color:#fff;
    border-radius:999px; padding:0 6px; display:inline-block;
  }
  .st-待機{background:var(--s-idle)} .st-移動{background:var(--s-move)}
  .st-作業{background:var(--s-work)} .st-相談{background:var(--s-talk)}
  .st-完成{background:var(--s-done)} .st-休憩{background:var(--s-rest)}
  .st-エラー{background:var(--s-err)}

  .staff .bubble{
    position:absolute; left:50%; bottom:100%; transform:translate(-50%,-6px);
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:5px 9px; font-size:11px; width:max-content; max-width:170px;
    box-shadow:0 4px 10px rgba(0,0,0,.14); opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; line-height:1.35; color:var(--ink);
  }
  .staff .bubble::after{
    content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#fff;
  }
  .staff.say .bubble{opacity:1; transform:translate(-50%,-10px)}
  .staff.spot{filter:drop-shadow(0 0 0 #fff)}
  .staff.spot .avatar{animation:pop .5s}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

  /* ===== サイドパネル ===== */
  .side{display:flex; flex-direction:column; gap:12px}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px}
  .card h3{margin:0 0 8px; font-size:12.5px; color:var(--olive-d); display:flex; gap:6px; align-items:center}
  .legend{display:flex; flex-wrap:wrap; gap:5px}
  .legend span{font-size:9.5px; color:#fff; border-radius:999px; padding:1px 7px}

  .log{list-style:none; margin:0; padding:0; max-height:180px; overflow:auto; font-size:11px}
  .log li{padding:5px 0; border-bottom:1px dashed var(--line); color:#455038; line-height:1.4}
  .log li b{color:var(--olive-d)}
  .log li time{color:#9aa38c; font-size:9.5px; margin-right:5px}

  .tray{display:flex; flex-direction:column; gap:7px; min-height:20px}
  .doc{
    background:linear-gradient(180deg,#fffef8,#fff6df); border:1px solid var(--gold);
    border-radius:10px; padding:7px 10px; font-size:11.5px; color:#6a520f;
    display:flex; align-items:center; gap:8px; animation:slidein .4s;
  }
  @keyframes slidein{from{opacity:0; transform:translateX(12px)}to{opacity:1}}
  .doc .ic{font-size:18px}
  .doc small{display:block; color:#a3833a; font-size:9.5px}

  .banner{
    position:absolute; left:50%; top:10px; transform:translateX(-50%);
    background:var(--olive-d); color:#fff; padding:6px 14px; border-radius:999px;
    font-size:12px; font-weight:700; z-index:8; opacity:0; transition:opacity .3s;
    box-shadow:0 6px 16px rgba(0,0,0,.2)
  }
  .banner.show{opacity:1}

  .demo-note{
    font-size:10.5px; color:#6b7358; background:var(--olive-l);
    border:1px dashed var(--olive); border-radius:8px; padding:6px 9px; line-height:1.5
  }
  .toolbar{display:flex; gap:6px; align-items:center; font-size:11px; color:#5c6a48}
  .toolbar button{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    padding:4px 9px; cursor:pointer; font-size:11px
  }
</style>

<header>
  <span class="logo">🌿 おりーぶ庵 AI-OS</span>
  <span class="tag">デモ / 見た目レイヤー</span>
  <div class="tiles">
    <div class="tile"><b id="t-ai">0</b><span>稼働AI</span></div>
    <div class="tile"><b>3</b><span>本日の期限</span></div>
    <div class="tile"><b>5</b><span>未処理</span></div>
    <div class="tile"><b>92%</b><span>入居率</span></div>
  </div>
</header>

<div class="wrap">
  <!-- 会社マップ -->
  <div>
    <div class="stage" id="stage">
      <div class="banner" id="banner"></div>

      <!-- 社長室（中央・入力欄はここだけ） -->
      <div class="president">
        <h2>🏛 社長室</h2>
        <p>あなたは社長です。ひとこと指示するだけ。</p>
        <div class="cmdrow">
          <input id="cmd" placeholder="例：変更届作成して" autocomplete="off">
          <button id="go">指示</button>
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div class="toolbar" style="margin-top:8px">
      <button id="pause">⏸ 自律モードを止める</button>
      <span>放っておくとAI社員が自分で動きます。</span>
    </div>
  </div>

  <!-- サイド -->
  <aside class="side">
    <div class="card">
      <div class="demo-note">
        ⚠️ これは<b>見た目のデモ</b>です。AI社員は動きますが、まだ本当の書類作成や集計はしていません。
        次の段階で「1業務ずつ」中身を入れていきます。
      </div>
    </div>
    <div class="card">
      <h3>📥 完成トレイ</h3>
      <div class="tray" id="tray"><div style="font-size:11px;color:#9aa38c">まだ成果物はありません</div></div>
    </div>
    <div class="card">
      <h3>🔔 社内ログ</h3>
      <ul class="log" id="log"></ul>
    </div>
    <div class="card">
      <h3>🎨 状態の色</h3>
      <div class="legend">
        <span class="st-待機">待機</span><span class="st-移動">移動</span>
        <span class="st-作業">作業</span><span class="st-相談">相談</span>
        <span class="st-完成">完成</span><span class="st-休憩">休憩</span>
        <span class="st-エラー">エラー</span>
      </div>
    </div>
  </aside>
</div>

<script>
"use strict";
/* =========================================================================
   おりーぶ庵 AI-OS デモ ロジック
   ・座標はすべて % （0〜100）。フロアの大きさが変わっても崩れません。
   ========================================================================= */

const stage = document.getElementById('stage');

/* ---- AI社員の定義（名前・顔・担当・自席の位置） ---- */
const STAFF = [
  {id:'秘書',   name:'秘書AI',      face:'🧑‍💼', x:50, y:30, lines:['はい社長！内容を確認します','担当部署へ振り分けますね','こちらまとめました']},
  {id:'行政',   name:'行政AI',      face:'🧑‍⚖️', x:15, y:16, lines:['大阪市の様式で作成します','加算要件を確認中…','様式を最新版に差し替えました']},
  {id:'監査',   name:'監査AI',      face:'🔍',   x:15, y:42, lines:['不足書類をチェックします','ここ、リスクありです','自己点検クリアです']},
  {id:'文書',   name:'文書AI',      face:'📝',   x:15, y:68, lines:['体裁を整えます','ドライブに保存しました','清書が完成しました']},
  {id:'請求',   name:'請求AI',      face:'🧾',   x:85, y:16, lines:['国保連データを作ります','実績と突合します','返戻ゼロで通りそうです']},
  {id:'経理',   name:'経理AI',      face:'💰',   x:85, y:42, lines:['数字を集計します','売上と経費を照合中','収支が出ました']},
  {id:'人事',   name:'人事AI',      face:'🤝',   x:85, y:68, lines:['職員情報を確認します','資格・研修を照合','契約書式を用意しました']},
  {id:'工房',   name:'工房AI',      face:'🛠️',  x:30, y:86, lines:['受注と納品を確認','工賃を計算します','作業実績まとめました']},
  {id:'ホーム', name:'ホーム管理AI', face:'🏠',   x:50, y:89, lines:['各ホームの空室を確認','西九条・九条…集計中','入居状況を更新しました']},
  {id:'看護',   name:'看護AI',      face:'🩺',   x:70, y:86, lines:['健康記録を確認します','受診予定を反映','看護記録OKです']},
  {id:'DX',     name:'DX AI',       face:'💻',   x:88, y:89, lines:['自動化できます','スプレッドと連携','処理を高速化しました']},
];

/* ---- 施設ゾーン（背景の飾り） ---- */
const ZONES = [
  ...STAFF.map(s=>({x:s.x, y:s.y, label:s.name, desk:'🖥️'})),
  {x:50, y:9,  label:'プリンター', desk:'🖨️'},
  {x:8,  y:90, label:'休憩室',    desk:'☕'},
  {x:92, y:9,  label:'書類棚',    desk:'🗄️'},
  {x:50, y:72, label:'会議室',    desk:'📊'},
];

/* ---- 業務プラン（キーワード → 担当AIの流れ＋成果物） ---- */
const PLANS = [
  {key:['変更届','管理者'], title:'管理者変更届を作成中…', icon:'📋',
   output:'管理者変更届（下書き）', outNote:'行政AI・人事AI・監査AI・文書AI 連携',
   flow:['秘書','行政','人事','監査','文書','秘書']},
  {key:['給与','賃金'], title:'給与を確認中…', icon:'💴',
   output:'給与確認レポート', outNote:'経理AI・人事AI 連携',
   flow:['秘書','経理','人事','経理']},
  {key:['請求','国保連'], title:'請求データを作成中…', icon:'🧾',
   output:'国保連 請求データ（案）', outNote:'請求AI・経理AI・監査AI 連携',
   flow:['秘書','請求','経理','監査','請求']},
  {key:['監査','点検','運営指導'], title:'自己点検を実施中…', icon:'✅',
   output:'自己点検チェックリスト', outNote:'監査AI・行政AI・文書AI 連携',
   flow:['秘書','監査','行政','文書']},
  {key:['利用者','入居','登録'], title:'利用者情報を登録中…', icon:'🧑‍🦽',
   output:'利用者登録票', outNote:'ホーム管理AI・人事AI・文書AI 連携',
   flow:['秘書','ホーム','人事','文書']},
  {key:['工房','受注','工賃','売上'], title:'工房の売上を集計中…', icon:'🛠️',
   output:'工房 売上集計', outNote:'工房AI・経理AI 連携',
   flow:['秘書','工房','経理']},
  {key:['シフト','勤務'], title:'シフトを集計中…', icon:'🗓️',
   output:'シフト集計表', outNote:'秘書AI・人事AI 連携',
   flow:['秘書','人事','秘書']},
  {key:['看護','健康','受診'], title:'健康記録を確認中…', icon:'🩺',
   output:'看護記録サマリ', outNote:'看護AI・人事AI 連携',
   flow:['秘書','看護','人事']},
];

const MEET = {x:50, y:72}; // 会議室（集合地点）

/* ---- 状態管理 ---- */
const S = {}; // id -> {el, x, y, tx, ty, state, moving, resolve, home}
let busy = false;         // 業務ワークフロー実行中か
let autonomous = true;    // 自律モード

/* ---- DOM生成：ゾーン ---- */
for(const z of ZONES){
  const d = document.createElement('div');
  d.className='zone'; d.style.left=z.x+'%'; d.style.top=(z.y+7)+'%';
  d.innerHTML = `<div class="desk">${z.desk}</div><div class="plaque">${z.label}</div>`;
  stage.appendChild(d);
}

/* ---- DOM生成：AI社員 ---- */
for(const s of STAFF){
  const el = document.createElement('div');
  el.className='staff';
  el.innerHTML = `<div class="bubble"></div><div class="avatar">${s.face}</div>
                  <div class="badge">${s.name}</div><div class="state st-待機">待機</div>`;
  el.style.left=s.x+'%'; el.style.top=s.y+'%';
  stage.appendChild(el);
  S[s.id] = {def:s, el, x:s.x, y:s.y, tx:s.x, ty:s.y, state:'待機',
             moving:false, resolve:null, home:{x:s.x,y:s.y},
             avatar:el.querySelector('.avatar'),
             stateEl:el.querySelector('.state'),
             bubbleEl:el.querySelector('.bubble')};
}
document.getElementById('t-ai').textContent = STAFF.length;

/* ---- 状態変更 ---- */
function setState(id, st){
  const o = S[id]; o.state = st;
  o.stateEl.className = 'state st-'+st;
  o.stateEl.textContent = st;
}
/* ---- 吹き出し ---- */
function say(id, text, ms=1600){
  const o = S[id];
  o.bubbleEl.textContent = text;
  o.el.classList.add('say');
  clearTimeout(o._sayT);
  o._sayT = setTimeout(()=>o.el.classList.remove('say'), ms);
}
/* ---- 目的地をセット（移動開始） ---- */
function moveTo(id, x, y){
  const o = S[id];
  o.tx = x; o.ty = y; o.moving = true;
  setState(id,'移動'); o.el.classList.add('walking');
  // 進む向きに応じて顔を反転
  o.avatar.style.transform = (x < o.x) ? 'scaleX(-1)' : 'scaleX(1)';
  return new Promise(res=>{ o.resolve = res; });
}

/* ---- メインループ：全AIを毎フレーム少しずつ動かす ---- */
let last = performance.now();
function tick(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  const speed = 16; // %/秒
  for(const id in S){
    const o = S[id];
    if(!o.moving) continue;
    const dx = o.tx-o.x, dy = o.ty-o.y;
    const dist = Math.hypot(dx,dy);
    const step = speed*dt;
    if(dist <= step){
      o.x = o.tx; o.y = o.ty; o.moving = false;
      o.el.classList.remove('walking');
      o.el.style.left=o.x+'%'; o.el.style.top=o.y+'%';
      if(o.state==='移動') setState(id,'待機');
      if(o.resolve){ const r=o.resolve; o.resolve=null; r(); }
    }else{
      o.x += dx/dist*step; o.y += dy/dist*step;
      o.el.style.left=o.x+'%'; o.el.style.top=o.y+'%';
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---- ユーティリティ ---- */
const wait = ms => new Promise(r=>setTimeout(r,ms));
function logLine(html){
  const ul = document.getElementById('log');
  const li = document.createElement('li');
  const t = new Date();
  const hh = String(t.getHours()).padStart(2,'0');
  const mm = String(t.getMinutes()).padStart(2,'0');
  li.innerHTML = `<time>${hh}:${mm}</time>${html}`;
  ul.prepend(li);
  while(ul.children.length>40) ul.lastChild.remove();
}
function banner(text){
  const b = document.getElementById('banner');
  b.textContent = text; b.classList.add('show');
  clearTimeout(b._t); b._t = setTimeout(()=>b.classList.remove('show'), 2600);
}
function pickLine(id, i){ const L=S[id].def.lines; return L[Math.min(i,L.length-1)]; }

/* ---- 業務ワークフロー実行 ---- */
function resolvePlan(text){
  for(const p of PLANS){ if(p.key.some(k=>text.includes(k))) return p; }
  return null;
}
async function runWorkflow(text){
  if(busy) return;
  const plan = resolvePlan(text);
  if(!plan){
    // 分からないときは秘書AIが聞き返す
    setState('秘書','エラー');
    say('秘書','「変更届」「給与」「請求」「工房売上」など、もう一度お願いします🙏', 3200);
    logLine(`<b>秘書AI</b>：指示を認識できませんでした`);
    setTimeout(()=>setState('秘書','待機'),1500);
    return;
  }
  busy = true;
  banner(plan.title);
  logLine(`👑 <b>社長</b>：「${text}」`);

  // 秘書AIがまず反応
  spotlight('秘書');

  let prev = null;
  for(let i=0;i<plan.flow.length;i++){
    const id = plan.flow[i];
    // 集合地点の周りに少しずらして並ぶ
    const angle = (i/plan.flow.length)*Math.PI*2;
    const tx = MEET.x + Math.cos(angle)*13;
    const ty = MEET.y + Math.sin(angle)*8;
    await moveTo(id, tx, ty);
    setState(id, i===plan.flow.length-1 ? '完成' : '相談');
    const line = (id==='秘書' && i>0) ? pickLine(id,2) : pickLine(id, i===0?0:1);
    say(id, line, 1700);
    logLine(`<b>${S[id].def.name}</b>：${line}`);
    if(prev){ say(prev, '→ お願いします', 900); }
    prev = id;
    await wait(1150);
  }

  // 成果物を完成トレイへ
  addDoc(plan);
  banner('✅ 完成しました');
  logLine(`📄 成果物「<b>${plan.output}</b>」が完成`);
  await wait(700);

  // 全員自席へ帰る
  for(const id of plan.flow){ goHome(id); }
  await wait(600);
  busy = false;
}

function spotlight(id){
  const o=S[id]; o.el.classList.add('spot');
  setTimeout(()=>o.el.classList.remove('spot'),600);
}
function goHome(id){
  const o=S[id];
  moveTo(id, o.home.x, o.home.y).then(()=>setState(id,'待機'));
}
function addDoc(plan){
  const tray = document.getElementById('tray');
  if(tray.dataset.empty!=='0'){ tray.innerHTML=''; tray.dataset.empty='0'; }
  const d = document.createElement('div');
  d.className='doc';
  d.innerHTML = `<span class="ic">${plan.icon}</span>
     <div><div>${plan.output}</div><small>${plan.outNote}</small></div>`;
  tray.prepend(d);
  while(tray.children.length>6) tray.lastChild.remove();
}

/* ---- 自律モード：手が空いていると勝手に動く ---- */
const IDLE_SPOTS = [
  {x:50,y:16,act:'プリンターへ'}, {x:8,y:84,act:'休憩室へ'},
  {x:92,y:16,act:'書類棚へ'}, {x:50,y:66,act:'会議室へ'},
];
setInterval(()=>{
  if(busy || !autonomous) return;
  for(const id in S){
    const o = S[id];
    if(o.moving || o.state!=='待機') continue;
    const r = Math.random();
    if(r < 0.12){
      // ぶらっと移動
      const spot = IDLE_SPOTS[Math.floor(Math.random()*IDLE_SPOTS.length)];
      const jx = spot.x + (Math.random()*8-4);
      const jy = spot.y + (Math.random()*6-3);
      moveTo(id, jx, jy).then(()=>{
        if(Math.random()<0.5){ setState(id,'作業'); say(id,'📄 作業中…',1400);
          setTimeout(()=>{ setState(id,'待機'); goHome(id); }, 1800); }
        else { setState(id,'休憩'); setTimeout(()=>{setState(id,'待機'); goHome(id);},1500); }
      });
    }else if(r < 0.17){
      // ひとりごと
      say(id, o.def.lines[0], 1300);
    }
  }
}, 2200);

/* ---- 入力ハンドラ ---- */
function submit(){
  const inp = document.getElementById('cmd');
  const v = inp.value.trim();
  if(!v) return;
  inp.value='';
  runWorkflow(v);
}
document.getElementById('go').addEventListener('click', submit);
document.getElementById('cmd').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });

/* ---- クイック指示チップ ---- */
const CHIPS = ['変更届作成して','給与確認して','請求書作って','監査チェックして','利用者登録して','工房売上を集計して'];
const chipBox = document.getElementById('chips');
for(const c of CHIPS){
  const b=document.createElement('button'); b.className='chip'; b.textContent=c;
  b.addEventListener('click',()=>runWorkflow(c));
  chipBox.appendChild(b);
}

/* ---- 自律モード ON/OFF ---- */
document.getElementById('pause').addEventListener('click', e=>{
  autonomous = !autonomous;
  e.target.textContent = autonomous ? '⏸ 自律モードを止める' : '▶ 自律モードを動かす';
});

/* ---- 最初のひとこと ---- */
setTimeout(()=>{ say('秘書','おはようございます、社長！ご指示をどうぞ。', 3000);
  logLine('🌿 AI-OS を起動しました'); }, 600);
</script>
